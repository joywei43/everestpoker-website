<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Everest Poker Room · Member Registration</title>
<link rel="icon" type="image/png" href="../members/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<script src="../waiting-list/config.js"></script>
<style>
:root{--ink:#121212;--gold:#D1A647;--gold-d:#BF9339;--bg:#F2F1EE;--line:#CFCAC0;--text:#1B1A17;--muted:#5F5B53;--red:#B42318;--red-l:#FDECEA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'IBM Plex Sans','Noto Sans TC','Noto Sans JP','Noto Sans KR','Noto Sans Thai',system-ui,sans-serif}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--ink);padding:26px 16px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
header img{width:170px;height:auto}
header h1{margin:0;color:var(--gold);font-size:14px;letter-spacing:.22em;font-weight:600}
.lang{position:absolute;top:12px;right:12px;background:#1E1D1A;color:#fff;border:1px solid #3A362E;border-radius:8px;height:34px;padding:0 6px;font:inherit;font-size:13px}
main{padding:20px 16px;flex:1}
form{background:#fff;border:1px solid #E3E0DA;border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
h2{margin:0;font-size:20px}
.sub{margin:-8px 0 0;color:var(--muted);font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:15px}
.opt{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=tel],input[type=date]{height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;background:#fff;width:100%;color:inherit}
input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:#3A3730}
.check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--gold-d)}
button.go{height:52px;border:0;border-radius:12px;background:var(--gold);color:#1B1406;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
button.go[disabled]{opacity:.6}
.err{background:var(--red-l);color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px}
.done{background:#fff;border:1px solid #E3E0DA;border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.tick{width:56px;height:56px;border-radius:50%;background:var(--gold);color:#1B1406;display:flex;align-items:center;justify-content:center}
.done p{margin:0;color:#3A3730}
footer{padding:18px 16px 28px;text-align:center;font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tg{margin-top:14px;display:flex;align-items:center;gap:10px;background:#229ED9;color:#fff;text-decoration:none;border-radius:14px;padding:14px 16px;font-weight:600}
.tg span:first-of-type{flex:1}.tg:hover{background:#1D8BC0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <label class="sr" for="lang">Language</label>
  <select id="lang" class="lang"><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="th">ไทย</option><option value="vi">Tiếng Việt</option></select>
  <img src="../members/logo.png" alt="Everest Poker Room">
  <h1>EVEREST POKER ROOM</h1>
</header>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<script>
(() => {
'use strict';
const API = (window.EVEREST_API_URL || 'https://everest-waiting-api.drumsjw47.workers.dev').replace(/\/$/, '');
const T = {
  en: { title: 'Member registration', sub: 'Takes 30 seconds. Our staff will complete the rest at the counter.', surname: 'Surname', given: 'Given name', tg: 'Live table status on Telegram', nick: 'Nickname', bday: 'Date of birth', contact: 'Phone, WhatsApp or Telegram', optional: 'optional', agree: 'I am 21 or older, my information is true, and I agree to the Everest Poker Room house rules.', submit: 'Register', sending: 'Sending…', required: 'Please fill in your surname, given name and date of birth, and tick the box.', age: 'Members must be 21 years or older.', many: 'Too many registrations from this device. Please ask the staff.', fail: 'Sending failed. Please try again or ask the staff.', doneTitle: 'Thank you!', done1: 'Your registration has been received.', done2: 'Please show your ID at the counter to receive your member number.', again: 'Register another person', foot: '21 years old and above only. Gambling can be addictive. Know when to stop.' },
  zh: { title: '會員註冊', sub: '只要 30 秒，其餘資料由櫃台協助完成。', surname: '姓', given: '名', tg: 'Telegram 即時桌況', nick: '暱稱', bday: '出生日期', contact: '電話、WhatsApp 或 Telegram', optional: '選填', agree: '我已年滿 21 歲，所填資料屬實，並同意遵守 Everest Poker Room 的規定。', submit: '送出註冊', sending: '送出中…', required: '請填寫姓、名與出生日期，並勾選同意。', age: '會員須年滿 21 歲。', many: '此裝置送出次數過多，請洽現場人員。', fail: '送出失敗，請再試一次或洽現場人員。', doneTitle: '感謝您的註冊！', done1: '我們已收到您的註冊資料。', done2: '請至櫃台出示證件，完成確認並取得會員號碼。', again: '幫其他人註冊', foot: '僅限 21 歲以上。博弈可能使人上癮，請適可而止。' },
  ja: { title: '会員登録', sub: '30秒で完了。残りは受付でスタッフがご案内します。', surname: '姓', given: '名', tg: 'Telegram でテーブル状況を見る', nick: 'ニックネーム', bday: '生年月日', contact: '電話・WhatsApp・Telegram', optional: '任意', agree: '21歳以上であり、記入内容が正しく、Everest Poker Room の規則に同意します。', submit: '登録する', sending: '送信中…', required: '姓・名・生年月日を入力し、チェックを入れてください。', age: '会員は21歳以上である必要があります。', many: 'この端末からの送信が多すぎます。スタッフにお問い合わせください。', fail: '送信に失敗しました。もう一度お試しいただくか、スタッフにお問い合わせください。', doneTitle: 'ありがとうございます！', done1: '登録を受け付けました。', done2: '受付で身分証をご提示のうえ、会員番号をお受け取りください。', again: '別の方を登録する', foot: '21歳以上の方のみ。ギャンブルは依存症になることがあります。' },
  ko: { title: '회원 등록', sub: '30초면 끝납니다. 나머지는 카운터에서 도와드립니다.', surname: '성', given: '이름', tg: 'Telegram 실시간 테이블 현황', nick: '닉네임', bday: '생년월일', contact: '전화, WhatsApp 또는 Telegram', optional: '선택', agree: '만 21세 이상이며, 입력한 정보가 사실이고, Everest Poker Room 규정에 동의합니다.', submit: '등록하기', sending: '전송 중…', required: '성, 이름, 생년월일을 입력하고 체크해주세요.', age: '회원은 만 21세 이상이어야 합니다.', many: '이 기기에서 너무 많이 제출되었습니다. 직원에게 문의해주세요.', fail: '전송에 실패했습니다. 다시 시도하거나 직원에게 문의해주세요.', doneTitle: '감사합니다!', done1: '등록이 접수되었습니다.', done2: '카운터에서 신분증을 보여주시고 회원 번호를 받으세요.', again: '다른 사람 등록하기', foot: '만 21세 이상만 이용 가능합니다. 도박은 중독될 수 있습니다.' },
  th: { title: 'ลงทะเบียนสมาชิก', sub: 'ใช้เวลาเพียง 30 วินาที ส่วนที่เหลือเจ้าหน้าที่จะช่วยที่เคาน์เตอร์', surname: 'นามสกุล', given: 'ชื่อ', tg: 'ดูสถานะโต๊ะสดบน Telegram', nick: 'ชื่อเล่น', bday: 'วันเกิด', contact: 'โทรศัพท์ WhatsApp หรือ Telegram', optional: 'ไม่บังคับ', agree: 'ฉันอายุ 21 ปีขึ้นไป ข้อมูลเป็นความจริง และยอมรับกฎของ Everest Poker Room', submit: 'ลงทะเบียน', sending: 'กำลังส่ง…', required: 'กรุณากรอกนามสกุล ชื่อ และวันเกิด และทำเครื่องหมายยอมรับ', age: 'สมาชิกต้องมีอายุ 21 ปีขึ้นไป', many: 'ส่งข้อมูลจากอุปกรณ์นี้มากเกินไป กรุณาติดต่อเจ้าหน้าที่', fail: 'ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่หรือติดต่อเจ้าหน้าที่', doneTitle: 'ขอบคุณ!', done1: 'เราได้รับการลงทะเบียนของคุณแล้ว', done2: 'กรุณาแสดงบัตรประจำตัวที่เคาน์เตอร์เพื่อรับหมายเลขสมาชิก', again: 'ลงทะเบียนให้ผู้อื่น', foot: 'สำหรับผู้มีอายุ 21 ปีขึ้นไปเท่านั้น การพนันอาจทำให้เสพติด' },
  vi: { title: 'Đăng ký thành viên', sub: 'Chỉ mất 30 giây. Nhân viên sẽ hoàn tất phần còn lại tại quầy.', surname: 'Họ', given: 'Tên', tg: 'Tình trạng bàn trực tiếp trên Telegram', nick: 'Biệt danh', bday: 'Ngày sinh', contact: 'Điện thoại, WhatsApp hoặc Telegram', optional: 'không bắt buộc', agree: 'Tôi từ 21 tuổi trở lên, thông tin là đúng sự thật và tôi đồng ý với nội quy của Everest Poker Room.', submit: 'Đăng ký', sending: 'Đang gửi…', required: 'Vui lòng nhập họ, tên, ngày sinh và đánh dấu đồng ý.', age: 'Thành viên phải từ 21 tuổi trở lên.', many: 'Thiết bị này đã gửi quá nhiều lần. Vui lòng liên hệ nhân viên.', fail: 'Gửi thất bại. Vui lòng thử lại hoặc liên hệ nhân viên.', doneTitle: 'Cảm ơn bạn!', done1: 'Chúng tôi đã nhận được đăng ký của bạn.', done2: 'Vui lòng xuất trình giấy tờ tùy thân tại quầy để nhận mã thành viên.', again: 'Đăng ký cho người khác', foot: 'Chỉ dành cho người từ 21 tuổi trở lên. Cờ bạc có thể gây nghiện.' }
};
const LANG_KEY = 'everest_register_language';
let lang = localStorage.getItem(LANG_KEY) || ({ zh: 'zh', ja: 'ja', ko: 'ko', th: 'th', vi: 'vi' }[(navigator.language || 'en').slice(0, 2)] || 'en');
const t = (k) => (T[lang] || T.en)[k] || T.en[k];
const main = document.getElementById('main'), sel = document.getElementById('lang');
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function age(b) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(b || ''); if (!m) return 0;
  const n = new Date(); let a = n.getFullYear() - Number(m[1]);
  if (n.getMonth() + 1 < Number(m[2]) || (n.getMonth() + 1 === Number(m[2]) && n.getDate() < Number(m[3]))) a--;
  return a;
}
function chrome() {
  document.documentElement.lang = { zh: 'zh-Hant', en: 'en', ja: 'ja', ko: 'ko', th: 'th', vi: 'vi' }[lang];
  sel.value = lang; document.getElementById('foot').textContent = t('foot');
}
function form(values = {}, error = '') {
  chrome();
  main.innerHTML = `<form id="rf" novalidate>
    <h2>${t('title')}</h2><p class="sub">${t('sub')}</p>
    <div class="two">
      <label class="f">${t('surname')}<input type="text" id="surname" autocomplete="family-name" maxlength="80" required value="${esc(values.surname)}"></label>
      <label class="f">${t('given')}<input type="text" id="given" autocomplete="given-name" maxlength="80" required value="${esc(values.given)}"></label>
    </div>
    <label class="f"><span>${t('nick')} <span class="opt">(${t('optional')})</span></span><input type="text" id="nick" autocomplete="nickname" maxlength="60" value="${esc(values.nick)}"></label>
    <label class="f">${t('bday')}<input type="date" id="bday" autocomplete="bday" required value="${esc(values.bday)}"></label>
    <label class="check"><input type="checkbox" id="agree" ${values.agree ? 'checked' : ''}><span>${t('agree')}</span></label>
    ${error ? `<div class="err" role="alert">${esc(error)}</div>` : ''}
    <button class="go" id="go">${t('submit')}</button></form>
    <a class="tg" href="https://t.me/MidoriPoker" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.5 4.1 2.9 11.3c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.3-2.3 4.8 3.6c.9.5 1.5.2 1.7-.8l3.1-14.8c.3-1.3-.5-1.9-1.5-1.5zM8.6 14.1l9.2-5.8c.4-.3.8-.1.5.2l-7.9 7.1-.3 3.3-1.5-4.8z"/></svg><span>${t('tg')}</span><span aria-hidden="true">›</span></a>`;
  document.getElementById('rf').onsubmit = submit;
}
const read = () => ({ surname: document.getElementById('surname').value.trim(), given: document.getElementById('given').value.trim(), nick: document.getElementById('nick').value.trim(), bday: document.getElementById('bday').value, agree: document.getElementById('agree').checked });
async function submit(e) {
  e.preventDefault();
  const v = read();
  if (!v.surname || !v.given || !v.bday || !v.agree) return form(v, t('required'));
  if (age(v.bday) < 21) return form(v, t('age'));
  const btn = document.getElementById('go'); btn.disabled = true; btn.textContent = t('sending');
  try {
    // familyName is the given name, the same field the original registration form used.
    const res = await fetch(API + '/register', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ surname: v.surname, familyName: v.given, nickName: v.nick, birthday: v.bday, language: lang, agreedTerms: true, agreedAge: true, agreedPolicy: true }) });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      return form(v, res.status === 429 ? t('many') : /21/.test(d.error || '') ? t('age') : t('fail'));
    }
    done();
  } catch (err) { form(v, t('fail')); }
}
function done() {
  chrome();
  main.innerHTML = `<div class="done" role="status"><div class="tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div>
    <h2>${t('doneTitle')}</h2><p>${t('done1')}</p><p><b>${t('done2')}</b></p>
    <button class="go" id="again" style="margin-top:8px;width:100%">${t('again')}</button></div>
    <a class="tg" href="https://t.me/MidoriPoker" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.5 4.1 2.9 11.3c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.3-2.3 4.8 3.6c.9.5 1.5.2 1.7-.8l3.1-14.8c.3-1.3-.5-1.9-1.5-1.5zM8.6 14.1l9.2-5.8c.4-.3.8-.1.5.2l-7.9 7.1-.3 3.3-1.5-4.8z"/></svg><span>${t('tg')}</span><span aria-hidden="true">›</span></a>`;
  document.getElementById('again').onclick = () => form();
}
sel.onchange = () => { const v = document.getElementById('rf') ? read() : null; lang = sel.value; localStorage.setItem(LANG_KEY, lang); v ? form(v) : done(); };
form();
})();
</script>
</body>
</html>
