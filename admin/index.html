<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<title>Everest Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Ultra&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="../waiting-list/config.js"></script>
<style>
:root{--ink:#121212;--ink2:#1D1C1A;--ink3:#2C2719;--gold:#D1A647;--gold-d:#BF9339;--bg:#EEF1F5;--card:#FFFFFF;--line:#DDE3EA;--line2:#EEF1F5;--text:#1B2430;--muted:#5B6675;--blue:#1F5FA8;--blue-d:#16467D;--blue-l:#E3EDF9;--green:#1E6B43;--green-l:#DFF3E7;--red:#B42318;--red-l:#FDECEA;--amber:#6B4A00;--amber-l:#FFF1D1;--note:#FFF8E6;--note-line:#EBD9A6}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 'IBM Plex Sans','Noto Sans TC',system-ui,sans-serif}
a{color:var(--blue)}a:hover{color:var(--blue-d)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'IBM Plex Mono',monospace}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
nav.side{flex:1 1 220px;max-width:100%;background:var(--ink);color:#E6ECF3;padding:20px 14px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:4px 8px}.brand img{width:132px;height:auto}
.brand b{letter-spacing:.2em;font-size:14px;color:var(--gold)}.brand small{display:block;font-size:12px;color:#A8A29A}
.navlinks{display:flex;flex-direction:column;gap:3px}
.navlinks a{color:#D8D2C8;text-decoration:none;padding:10px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.navlinks a[aria-current=page]{background:var(--ink3);color:var(--gold);font-weight:600}
.navlinks a:hover{background:#24221E;color:#fff}
.pill{background:#2C4363;color:#fff;border-radius:999px;padding:0 8px;font-size:12px;line-height:20px}
.staffbox{margin-top:auto;padding:12px;border-radius:10px;background:var(--ink2);font-size:13px}
.staffbox small{color:#A8A29A;display:block}
.staffbox button{margin-top:8px;background:none;border:1px solid #4A443A;color:#D8D2C8;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px}
main{flex:999 1 560px;min-width:0;padding:24px 28px 48px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:24px}h2{margin:0;font-size:17px}
.sub{color:var(--muted);margin:4px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card.note{background:var(--note);border-color:var(--note-line)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .k{font-size:13px;color:var(--muted)}.tile .v{font-size:24px;font-weight:700;margin-top:2px}.tile .s{font-size:12px;color:var(--muted)}
.btn{height:38px;padding:0 14px;border-radius:8px;border:1px solid #CDD5DF;background:#fff;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:#9AA7B6}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1B1406;font-weight:600}.btn.primary:hover{background:var(--gold-d);border-color:var(--gold-d)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=password],input[type=email],select,textarea{height:38px;border:1px solid #CDD5DF;border-radius:8px;padding:0 10px;background:#fff;min-width:0}
textarea{height:auto;padding:8px 10px;resize:vertical;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:#3A4554}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#F6F8FB}
td.num,th.num{text-align:right;white-space:nowrap}
.chip{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--bg);color:#3A4554;white-space:nowrap}
.chip.green{background:var(--green-l);color:var(--green)}.chip.red{background:var(--red-l);color:var(--red)}.chip.amber{background:var(--amber-l);color:var(--amber)}.chip.blue{background:var(--blue-l);color:#1F4F8A}.chip.dark{background:#2A3442;color:#fff}
.muted{color:var(--muted)}.small{font-size:12px}
.bar{height:8px;border-radius:999px;background:#E4E9EF;overflow:hidden;flex:1}.bar>i{display:block;height:100%;background:var(--blue);border-radius:999px}
.gcard{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.gcard[aria-pressed=true]{border-color:var(--blue)}
.msg{padding:10px 14px;border-radius:10px;background:var(--blue-l);color:#1F4F8A}.msg.err{background:var(--red-l);color:var(--red)}.msg.ok{background:var(--green-l);color:var(--green)}
.login{max-width:380px;margin:12vh auto;padding:28px}
.ac{position:relative}.ac ul{position:absolute;z-index:5;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,27,45,.12);max-height:260px;overflow:auto}
.ac li button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}.ac li button:hover,.ac li button:focus{background:var(--blue-l)}
dialog{border:0;border-radius:14px;padding:0;max-width:720px;width:calc(100% - 32px)}dialog::backdrop{background:rgba(15,27,45,.45)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:14px}
.ph{width:112px;height:112px;border-radius:50%;background:#F3E7C8;color:#5E410C;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;overflow:hidden;flex:none}.ph img{width:100%;height:100%;object-fit:cover}
.evno{display:flex;align-items:center;border:1px solid #CDD5DF;border-radius:8px;background:#fff;overflow:hidden}.evno>span{padding:0 4px 0 10px;font-family:'IBM Plex Mono',monospace;color:var(--muted);font-weight:500}.evno input{border:0!important;flex:1;font-family:'IBM Plex Mono',monospace;padding-left:0!important}.evno:focus-within{outline:2px solid var(--blue);outline-offset:1px}
.seg{display:inline-flex;background:#fff;border:1px solid #CDD5DF;border-radius:10px;padding:3px;gap:2px}.seg button{height:34px;padding:0 14px;border:0;border-radius:8px;background:transparent;font-weight:600;cursor:pointer;color:#3A4554}.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline dotted}
.st{width:14px;height:14px;border-radius:50%;border:2px solid #9AA7B6;display:block}.st.on{background:var(--ink);border-color:var(--ink)}.st.rest{background:#E2B04A;border-color:#E2B04A}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:700px){.wide{grid-column:span 2}}
@media (max-width:640px){main{padding:16px}nav.side{gap:12px}.navlinks{flex-direction:row;flex-wrap:wrap}.staffbox{margin-top:0}}
.bbj-edit{position:absolute;z-index:1;right:12px;top:12px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4);font-family:'IBM Plex Sans',system-ui,sans-serif;letter-spacing:0}
.bbj{position:relative;background:#0B0B0B;color:#fff;border-radius:14px;padding:18px 16px 16px;text-align:center;font-family:'Ultra',Georgia,serif;letter-spacing:.5px;margin-bottom:16px}
.bbj-date{font-size:clamp(14px,2.2vw,20px);opacity:.92}.bbj-main{font-size:clamp(28px,6vw,64px);line-height:1.1;margin:4px 0}.bbj-res{font-size:clamp(15px,2.6vw,26px)}
.floor{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;align-items:start}@media(max-width:900px){.floor{grid-template-columns:1fr}}
.floor-tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 18px}@media(max-width:560px){.floor-tables{grid-template-columns:1fr}}
.ptable{position:relative;aspect-ratio:1.7;margin:26px 28px;cursor:pointer;border-radius:999px}
.ptable .felt{position:absolute;inset:0;border-radius:999px;background:radial-gradient(ellipse at 50% 40%,#2F7A52,#1B4D33);border:6px solid #6B4A2A;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:2px;transition:box-shadow .15s}
.ptable .felt b{font-size:18px}.ptable .felt span{font-size:12px;opacity:.9}.ptable .felt small{font-size:11px;opacity:.75}
.ptable.off .felt{background:#8B96A3;border-color:#B5BDC7}.ptable.sel .felt{box-shadow:0 0 0 4px var(--gold),0 6px 16px rgba(0,0,0,.25)}
.ptable:focus-visible{outline:3px solid var(--blue);outline-offset:6px}
.ptable .dealer{position:absolute;left:50%;top:-2px;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid #CDD5DF;font-size:10px;font-weight:700;display:grid;place-items:center;color:#333}
.ptable .seat{position:absolute;transform:translate(-50%,-50%)}
.seat-e{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fff;border:1.5px dashed #AEB8C4;font-size:13px;color:#8792A0}
.seat-p{padding:0;border:0;background:none;cursor:pointer;border-radius:50%}.seat-p:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.av{display:inline-grid;place-items:center;border-radius:50%;background:#F4E7C6;color:#6B4A00;font-weight:700;overflow:hidden;flex:none;border:3px solid var(--green)}
.av.rest{border-color:#E2B04A}.av.left{border-color:#CDD5DF}.av.guest{background:#E7ECF2;color:#4A5563}.av img{width:100%;height:100%;object-fit:cover}
.floor-side{background:var(--bg);border-radius:12px;padding:14px;min-height:200px}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;color:inherit}
.prow:hover{border-color:var(--gold)}.prow .pn{flex:1;min-width:0;display:flex;flex-direction:column}.prow .pn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow small{color:var(--muted);font-size:12px}.prow .pv{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.pcard{position:absolute;z-index:60;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(15,27,45,.22);padding:14px 16px}
.pc-x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.pc-now{margin:10px 0;font-size:13px}.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pc-st{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.6}
.pcard .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.pc-t{width:100%;font-size:12px;border-collapse:collapse}.pc-t td{padding:3px 4px;border-bottom:1px solid var(--line2)}
.floor-side .k{font-size:12px;color:var(--muted)}
.pt{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.25}.pt small{font-size:11px;color:var(--muted);white-space:nowrap}td:not(.num) .pt,.pv .pt{align-items:inherit}
.pc-note{margin-top:8px;background:var(--note);border:1px solid var(--note-line);border-radius:8px;padding:6px 8px;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
'use strict';
const API = (window.EVEREST_API_URL || 'https://everest-waiting-api.drumsjw47.workers.dev').replace(/\/$/, '');
const TOKEN_KEY = 'ppm-session', USER_KEY = 'ppm-user', ROLE_KEY = 'ppm-role';
const TYPES = { free_chip: 'Free Chip', promo_cash: 'Promotion-Cash', promo_chip: 'Promotion-Chip', hotel: 'Hotel Stay', transportation: 'Transportation', tournament_ticket: 'Tournament Tickets' };
const TYPE_CHIP = { free_chip: 'blue', promo_cash: 'green', promo_chip: 'amber', hotel: '', transportation: '', tournament_ticket: 'dark' };
const root = document.getElementById('root');
let token = sessionStorage.getItem(TOKEN_KEY) || '';
let staff = sessionStorage.getItem(USER_KEY) || '';
let role = sessionStorage.getItem(ROLE_KEY) || 'admin';
const isManager = () => role !== 'staff';
const isMaster = () => role === 'master';
let groupsCache = null;

// ---------- helpers ----------
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const peso = (n) => '₱' + Math.round(Number(n) || 0).toLocaleString('en-US');
const hm = (s) => { s = Math.max(0, Math.round(Number(s) || 0)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h + 'h ' + String(m).padStart(2, '0') + 'm'; };
const hhmm = (s) => { s = Math.max(0, Math.round(Number(s) || 0)); return String(Math.floor(s / 3600)).padStart(2, '0') + ':' + String(Math.floor((s % 3600) / 60)).padStart(2, '0'); };
const fmt = (t, opts) => t ? new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Manila', ...opts }).format(new Date(t * 1000)) : '—';
const day = (t) => fmt(t, { day: 'numeric', month: 'short', year: 'numeric' });
const time = (t) => fmt(t, { hour: '2-digit', minute: '2-digit', hour12: false });
const dateTime = (t) => fmt(t, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Manila' }).format(new Date());
const daysAgo = (n) => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Manila' }).format(new Date(Date.now() - n * 864e5));
const perHour = (amount, secs) => secs > 0 ? peso(amount / (secs / 3600)) : '—';
const statusChip = (s) => `<span class="chip ${s === 'active' ? 'green' : s === 'suspended' ? 'amber' : 'red'}">${esc(s)}</span>`;
const groupChip = (name) => name ? `<span class="chip blue">${esc(name)}</span>` : '<span class="chip amber">No group</span>';

async function api(path, method = 'GET', body) {
  const res = await fetch(API + path, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, ...(body === undefined ? {} : { body: JSON.stringify(body) }) });
  let data = {}; try { data = await res.json(); } catch (e) {}
  if (res.status === 401) { token = ''; sessionStorage.removeItem(TOKEN_KEY); render(); throw new Error('Please sign in again.'); }
  if (res.status === 301 && data.moved_to) { const e = new Error('moved'); e.movedTo = data.moved_to; throw e; }
  if (!res.ok) { const e = new Error(data.error || 'Request failed (' + res.status + ')'); e.code = data.code; e.data = data; throw e; }
  return data;
}
async function groups() { if (!groupsCache) groupsCache = (await api('/groups')).groups; return groupsCache; }
const groupOptions = (gs, selected, extra = '') => extra + gs.map((g) => `<option value="${esc(g.id)}" ${g.id === selected ? 'selected' : ''}>${esc(g.name)}${g.label ? ' — ' + esc(g.label) : ''}${g.kind === 'inhouse' ? ' (Marketing)' : ''}</option>`).join('');
function flash(el, text, kind = '') { el.innerHTML = text ? `<div class="msg ${kind}" role="status">${esc(text)}</div>` : ''; }
// The signed-in account is recorded as the actor by the server; this is only for display and defaults.
function needStaff() { return staff; }
async function loadMe() {
  try { const me = await api('/me'); const wasRole = role; staff = me.user || ''; role = me.role || 'admin'; sessionStorage.setItem(USER_KEY, staff); sessionStorage.setItem(ROLE_KEY, role); if (wasRole !== role) render(); else renderStaff(); } catch (e) {}
}
// Old addresses (from /members/) still work.
const ALIASES = { operation: 'liveoperation', groups: 'playergroups', unmatched: 'unmatchedppm', staff: 'staffaccounts', import: 'importmembers', report: 'operationreport' };
function parseHash() { const h = location.hash.replace(/^#\/?/, '').split('?')[0]; const [page, ...rest] = h.split('/'); return { page: ALIASES[page] || page || (isManager() ? 'liveoperation' : 'members'), arg: rest.map(decodeURIComponent).join('/') }; }

// ---------- shell ----------
function render() {
  if (!token) return renderLogin();
  const { page } = parseHash();
  const link = (p, label, extra = '') => `<a href="#/${p}" ${page === p || (p === 'members' && page === 'member') ? 'aria-current="page"' : ''}>${label}${extra}</a>`;
  root.innerHTML = `<div class="app">
    <nav class="side" aria-label="Main">
      <div class="brand"><img src="logo.png" alt="Everest Poker Room"><div><b>EVEREST</b><small>Admin console</small></div></div>
      <div class="navlinks">
        ${isManager() ? link('liveoperation', 'Live Operation') : ''}
        ${isManager() ? link('operationreport', 'Operation Report') : ''}
        ${isManager() ? link('insurance', 'Insurance') : ''}
        ${link('members', 'Members')}
        ${link('playergroups', 'Player groups')}
        ${link('unmatchedppm', 'Unmatched PPM')}
        ${link('approvals', 'Approvals', '<span class="pill" id="pendingPill" hidden></span>')}
        ${link('promotions', 'Promotions')}
        ${link('telegrampost', 'Telegram post')}
        ${isManager() ? link('importmembers', 'Import members') : ''}
        ${isMaster() ? link('staffaccounts', 'Staff accounts') : ''}
        ${isMaster() ? link('historylog', 'History Log') : ''}
        <a href="../ppm/">PPM tables ↗</a>
      </div>
      <div class="staffbox" id="staffbox"></div>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>`;
  renderStaff();
  const view = document.getElementById('view');
  const pages = { insurance: isManager() ? viewInsurance : viewMembers, members: viewMembers, member: viewMember, playergroups: viewGroups, unmatchedppm: viewUnmatched, approvals: viewApprovals, liveoperation: isManager() ? viewOperation : viewMembers, operationreport: isManager() ? viewReport : viewMembers, promotions: viewPromotions, telegrampost: viewTelegram, staffaccounts: isMaster() ? viewStaff : viewMembers, importmembers: isManager() ? viewImport : viewMembers, historylog: isMaster() ? viewHistory : viewMembers };
  refreshPending();
  (pages[page] || viewMembers)(view, parseHash().arg).catch((e) => { view.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; });
}
function renderStaff() {
  const box = document.getElementById('staffbox'); if (!box) return;
  box.innerHTML = `<small>Signed in as</small><div><b>${esc(staff || '—')}</b> <span class="small" style="color:var(--gold)">${isMaster() ? 'Master' : isManager() ? 'Manager' : 'Staff'}</span></div>
    <button type="button" id="logout">Sign out</button>`;
  box.querySelector('#logout').onclick = async () => { try { await api('/logout', 'POST', {}); } catch (e) {} token = ''; staff = ''; sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(USER_KEY); sessionStorage.removeItem(ROLE_KEY); render(); };
}
function renderLogin() {
  root.innerHTML = `<div class="card login"><div style="background:#121212;border-radius:12px;padding:18px;margin:-8px -8px 18px;text-align:center"><img src="logo.png" alt="Everest Poker Room" style="width:160px;height:auto"></div><h1>Everest members</h1><p class="sub">Staff sign in</p>
    <form id="lf" style="margin-top:16px;display:flex;flex-direction:column;gap:12px"><label class="f">Username<input type="text" id="un" autocomplete="username" required maxlength="60" autocapitalize="off" spellcheck="false"></label>
    <label class="f">Password<input type="password" id="pw" autocomplete="current-password" required maxlength="200"></label>
    <button class="btn primary">Sign in</button></form><div id="lm" style="margin-top:12px"></div></div>`;
  document.getElementById('lf').onsubmit = async (e) => {
    e.preventDefault(); const m = document.getElementById('lm');
    try {
      const res = await fetch(API + '/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('un').value.trim(), password: document.getElementById('pw').value }) });
      const d = await res.json(); if (!res.ok) throw new Error(d.error || 'Sign in failed');
      token = d.token; staff = d.user || ''; role = d.role || 'admin'; sessionStorage.setItem(TOKEN_KEY, token); sessionStorage.setItem(USER_KEY, staff); sessionStorage.setItem(ROLE_KEY, role); render();
    } catch (err) { flash(m, err.message, 'err'); }
  };
}

// ---------- member search box (used on several pages) ----------
function memberPicker(input, onPick) {
  const wrap = input.parentElement; const list = document.createElement('ul'); list.hidden = true; wrap.appendChild(list);
  let timer, seq = 0;
  input.setAttribute('autocomplete', 'off');
  input.addEventListener('input', () => {
    clearTimeout(timer); const q = input.value.trim(); if (!q) { list.hidden = true; return; }
    timer = setTimeout(async () => {
      const mine = ++seq; let res; try { res = await api('/members?limit=8&q=' + encodeURIComponent(q)); } catch (e) { return; }
      if (mine !== seq) return;

// Page buttons: first, last, and two either side of the current page.
function pager(page, pages) {
  if (pages <= 1) return '';
  const want = new Set([1, pages]); for (let p = page - 2; p <= page + 2; p++) if (p >= 1 && p <= pages) want.add(p);
  const list = [...want].sort((a, b) => a - b); let out = '', prev = 0;
  for (const p of list) { if (p - prev > 1) out += '<span class="muted" style="padding:0 4px">…</span>'; out += `<button type="button" class="btn sm" data-page="${p}" ${p === page ? 'aria-current="page" style="background:var(--gold);border-color:var(--gold);color:#121212;font-weight:700"' : ''}>${p}</button>`; prev = p; }
  return `<nav class="row" aria-label="Pages" style="gap:4px;justify-content:center;margin-top:12px;flex-wrap:wrap"><button type="button" class="btn sm" data-page="${page - 1}" ${page === 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>${out}<button type="button" class="btn sm" data-page="${page + 1}" ${page === pages ? 'disabled' : ''} aria-label="Next page">›</button></nav>`;
}

function openMemberDialog(view, member, save) {
  const d = view.querySelector('#md'), f = view.querySelector('#mf');
  f.reset(); view.querySelector('#mdTitle').textContent = member ? 'Edit profile' : 'New member';
  view.querySelector('#mdGroup').hidden = !!member; view.querySelector('#mdNo').hidden = !!member; view.querySelector('#mdRemark').hidden = !!member;

  let suggested = '';

    api('/members/next-number').then(fill).catch(() => api('/members/next-number').then(fill)).catch((err) => flash(view.querySelector('#mdMsg'), 'Could not load the next member number (' + err.message + '). Leave it blank and the system will assign one.', 'err'));
  }

  const nat = (member && member.nationality) || '';

    if (f.elements.nat_sel.value !== 'other') data.nationality = f.elements.nat_sel.value;

// Center-crop and shrink a phone photo to 320×320 JPEG (~30 KB) before upload.
function squarePhoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight), size = 320, c = document.createElement('canvas');
      c.width = size; c.height = size;
      c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This file is not a photo the browser can read.')); };
    img.src = url;
  });
}
// Rest share of the time at the table: under 10% green, up to 20% yellow, above 20% red.
// Playing hours = total time at the table minus rest. Shown first; total and rest underneath (HH:MM).
const restColor = (rest, play) => { const t = (rest || 0) + (play || 0); if (!t) return 'inherit'; const pct = rest / t * 100; return pct <= 10 ? 'var(--green)' : pct <= 20 ? 'var(--amber)' : 'var(--red)'; };
const restLine = (play, rest) => `<span style="white-space:nowrap">Total ${hhmm((play || 0) + (rest || 0))} / Rest <span style="color:${restColor(rest, play)};font-weight:600" title="${(play || rest) ? Math.round((rest || 0) / ((play || 0) + (rest || 0)) * 100) : 0}% of the time at the table">${hhmm(rest)}</span></span>`;
function playTime(play, rest) { return `<span class="pt"><b class="mono">${hhmm(play)}</b><small class="mono">${restLine(play, rest)}</small></span>`; }
function restBadge(rest, play) {
  const total = (rest || 0) + (play || 0);
  if (!total) return '<span class="muted">—</span>';
  const pct = Math.round(rest / total * 100);
  const c = pct <= 10 ? 'green' : pct <= 20 ? 'amber' : 'red';
  return `<span class="chip ${c}" title="Rest ÷ (play + rest)">Rest ${pct}%</span>`;
}
const signedPeso = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + peso(Math.abs(n));
function statTiles(st) {
  const wlColor = st.win_loss > 0 ? 'var(--green)' : st.win_loss < 0 ? 'var(--red)' : 'inherit';
  return `${tile('Visit days', st.days + ' days', st.sessions + ' sessions')}
    <div class="tile"><div class="k">Playing hours</div><div class="v mono">${hhmm(st.secs)}</div><div class="s mono">${restLine(st.secs, st.rest_secs)}</div></div>
    ${tile('Buy-in', peso(st.buy_in), 'Cash-out ' + peso(st.cash_out))}
    <div class="tile"><div class="k">History W/L</div><div class="v" style="color:${wlColor}">${st.with_cash_out ? signedPeso(st.win_loss) : '—'}</div><div class="s">${st.with_cash_out} of ${st.sessions} sessions with cash-out${st.busted ? ' · ' + st.busted + ' busted' : ''}</div></div>
    ${tile('Rewards given', peso(st.rewards), perHour(st.rewards, st.secs) + ' per play hour' + (st.rewards_pending ? ' · ' + peso(st.rewards_pending) + ' waiting' : ''))}`;
}
const tile = (k, v, s) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;

// ---------- Telegram lineup post ----------
function telegramText(d) {
  const bl = (b) => String(b || '').replace(/\s*\/\s*/g, '-');
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const ordinal = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? 'TH' : ({ 1: 'ST', 2: 'ND', 3: 'RD' })[n % 10] || 'TH');
  if (!d.tables.length) return ''; // nothing to post when no table is open
  const L = ['🔥 THE ACTION IS ON AT EVEREST POKER! 🃏🔥', 'Check our Latest Update on website:', 'www.everestpokerroom.com/waiting-list', ''];
  {
    const games = [...new Set(d.tables.map((t) => `${bl(t.blinds)} ${t.game_type}`.trim()))];
    L.push(` ${d.tables.length} TABLE${d.tables.length === 1 ? '' : 'S'} ONGOING – ${games.join(' & ')}`, '👥 Current Lineup:');
    for (const t of d.tables) {
      L.push('', ` TABLE ${t.number} ${bl(t.blinds)} ${t.game_type}`, '');
      for (const n of t.nationalities) L.push(`${n.count} ${n.nationality ? n.nationality + ' ' : 'Other '}${n.count === 1 ? 'Player' : 'Players'}`);
      if (!t.players) L.push('Table just opened — be the first to sit!');
      L.push(t.open_seats ? `(${plural(t.open_seats, 'SEAT').toUpperCase()} OPEN )` : `(TABLE FULL${t.waiting ? ` – ${t.waiting} ON THE WAITING LIST` : ' – JOIN THE WAITING LIST'} )`);
      // A full table (9 players) always invites players to the next table, as long as no open table has a free seat.
      if (!t.open_seats && d.tables.every((x) => !x.open_seats)) L.push(`SEAT OPEN FOR ${ordinal(d.tables.length + 1)} TABLE`);
    }
  }
  L.push('', '', '🔥 Reserve your seat, players!', 'Come join the action at Everest Poker!🃏♠️♥️♣️');
  return L.join('\n');
}

  let edited = false; ta.oninput = () => { edited = true; };

    <dialog id="bbjOpenD"><form method="dialog" id="bbjOpenF"><h2>BBJ opening balance</h2>
      <label class="f">First day of the ledger<input type="date" name="day" required value="${esc(J.opening ? J.opening.day : d.from)}"></label>
      <label class="f">Main before that day (₱)<input type="text" inputmode="decimal" name="main" required value="${J.opening ? J.opening.main : ''}"></label>
      <label class="f">1st Reserved before that day (₱)<input type="text" inputmode="decimal" name="reserve" required value="${J.opening ? J.opening.reserve : ''}"></label><div id="bbjOpenMsg"></div>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" id="bbjOpenSave">Save</button></div></form></dialog>
    <dialog id="rd"><form method="dialog" id="rdf"><h2 id="rdTitle"></h2>
      <div class="form" id="rdTables"></div>
      <p style="margin:0">Total <b id="rdSum">₱0</b></p>
      ${J.balance ? `<label class="f">BBJ collected — total for the day (₱)<input type="text" inputmode="decimal" id="rdBbj" placeholder="e.g. 28,100"></label><p class="small muted" id="rdBbjSplit" style="margin:0"></p>` : ''}
      <p class="small muted" id="rdInfo" style="margin:0"></p>
      <div id="rdMsg"></div><div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" id="rdSave">Save</button></div></form></dialog>`;
  const rf = view.querySelector('#rangeF');
  rf.onsubmit = (e) => { e.preventDefault(); setRange(rf.from.value, rf.to.value); };
  rf.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => { const [a, z] = b.dataset.r.split('|'); setRange(a, z); });
  const dlg = view.querySelector('#rd'), f = view.querySelector('#rdf');
  const num = (v) => { const t = String(v).replace(/[,\s₱]/g, ''); return t === '' ? null : Number(t); };
  const openDay = (r) => {
    view.querySelector('#rdTitle').textContent = `${r.day} (${wd(r.day)})`;
    // Tables that ran that day (and any already entered); before table records existed, all tables.
    const names = [...new Set([...r.tables, ...Object.keys(r.table_revenue)])].sort();
    const list = names.length ? names : ['T1', 'T2', 'T3', 'T5'];
    view.querySelector('#rdTables').innerHTML = list.map((k) => `<label class="f">${esc(k)} revenue (₱)<input type="text" inputmode="numeric" data-t="${esc(k)}" value="${r.table_revenue[k] ?? ''}" placeholder="${r.table_seconds_by[k] ? hm(r.table_seconds_by[k]) + ' open' : 'e.g. 45000'}"></label>`).join('');
    const inputs = [...view.querySelectorAll('#rdTables input')];
    const sum = () => { view.querySelector('#rdSum').textContent = peso(inputs.reduce((a, i) => a + (num(i.value) || 0), 0)); };
    inputs.forEach((i) => i.oninput = sum); sum();
    const bi = view.querySelector('#rdBbj'), bs = view.querySelector('#rdBbjSplit');
    if (bi) {
      bi.value = r.bbj_amount ?? '';
      const show = () => { const v = num(bi.value); if (v == null || !(v >= 0)) { bs.textContent = ''; return; } const c = Math.round(v * 100), tk = Math.round(c * 0.3), pot = c - tk, pg = Math.round(tk * 0.25), cdc = Math.round(tk * 0.05), mn = Math.round(pot * 0.7);
        bs.textContent = `Admin fee ${peso2(tk / 100)} (Pagcor ${peso2(pg / 100)} · CDC ${peso2(cdc / 100)} · Everest ${peso2((tk - pg - cdc) / 100)}) · to pot ${peso2(pot / 100)} (Main ${peso2(mn / 100)} · 1st Reserved ${peso2((pot - mn) / 100)})`; };
      bi.oninput = show; show();
    }
    view.querySelector('#rdInfo').textContent = names.length ? `PPM: table hours ${hm(r.table_seconds)} · ${r.visitors} visitors · buy-in ${peso(r.buy_in)}` : 'No table records for this day, so all tables are listed. Leave blank the ones that did not open.';
    flash(view.querySelector('#rdMsg'), '');
    view.querySelector('#rdSave').onclick = async (e) => {
      e.preventDefault();
      const tables = {};
      for (const i of inputs) { const v = num(i.value); if (v != null && !(v >= 0)) { flash(view.querySelector('#rdMsg'), 'Revenue must be a number, 0 or more. Leave blank if not known yet.', 'err'); return; } tables[i.dataset.t] = v == null ? '' : v; }
      const body = { tables };
      if (bi) { const v = num(bi.value); if (v != null && !(v >= 0)) { flash(view.querySelector('#rdMsg'), 'BBJ collected must be a number, 0 or more.', 'err'); return; } body.bbj_amount = v == null ? '' : v; }
      try { await api('/report/day/' + r.day, 'PUT', body); dlg.close(); viewReport(view); } catch (err) { flash(view.querySelector('#rdMsg'), err.message, 'err'); }
    };
    dlg.showModal(); if (inputs[0]) inputs[0].focus();
  };
  view.querySelectorAll('tr[data-day]').forEach((tr) => { const r = d.days.find((x) => x.day === tr.dataset.day); tr.onclick = () => openDay(r); tr.onkeydown = (e) => { if (e.key === 'Enter') openDay(r); }; });
  view.querySelector('#csv').onclick = () => {
    const lines = [['Day', 'Weekday', 'Revenue PHP', 'BBJ collected PHP', 'Tables', 'Table hours', 'Operating hours', 'Visitors', 'Members', 'New members', 'Sessions', 'Player hours', 'Buy-in PHP', 'Cash-out PHP', 'Levels (table hours)', 'Revenue by table', 'Entered by']]
      .concat(d.days.map((r) => [r.day, wd(r.day), r.revenue ?? '', r.bbj_amount ?? '', r.tables.join(' '), (r.table_seconds / 3600).toFixed(2), (r.operating_seconds / 3600).toFixed(2), r.visitors, r.members, r.new_members, r.sessions, (r.play_seconds / 3600).toFixed(2), r.buy_in, r.cash_out,
        Object.entries(r.levels).filter(([, v]) => v.table_seconds).map(([k, v]) => `${k} ${(v.table_seconds / 3600).toFixed(2)}`).join('; '), Object.entries(r.table_revenue).map(([k, v]) => `${k} ${v}`).join('; '), r.updated_by]))
      .concat([['Total', '', T.revenue, J.totals ? J.totals.amount : '', '', (T.table_seconds / 3600).toFixed(2), (T.operating_seconds / 3600).toFixed(2), T.visits, '', T.new_members, T.sessions, (T.play_seconds / 3600).toFixed(2), T.buy_in, T.cash_out, '', '', '']]);
    const csv = lines.map((row) => row.map((c) => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = `everest-operation-report-${d.from}-to-${d.to}.csv`; a.click();
  };
  const payD = view.querySelector('#bbjPayD'), openD = view.querySelector('#bbjOpenD');
  const bp = view.querySelector('#bbjPay'); if (bp) bp.onclick = () => { flash(view.querySelector('#bbjPayMsg'), ''); payD.showModal(); };
  const bo = view.querySelector('#bbjOpen'); if (bo) bo.onclick = () => { flash(view.querySelector('#bbjOpenMsg'), ''); openD.showModal(); };
  view.querySelector('#bbjPaySave').onclick = async (e) => {
    e.preventDefault(); const f2 = view.querySelector('#bbjPayF'), paid = num(f2.paid.value);
    if (!f2.day.value || !(paid > 0)) { flash(view.querySelector('#bbjPayMsg'), 'Pick the day and enter the amount paid.', 'err'); return; }
    if (!confirm(`Record a jackpot payout of ${peso2(paid)} on ${f2.day.value}?`)) return;
    try { await api('/report/bbj/payout', 'POST', { day: f2.day.value, paid, note: f2.note.value }); payD.close(); viewReport(view); } catch (err) { flash(view.querySelector('#bbjPayMsg'), err.message, 'err'); }
  };
  view.querySelector('#bbjOpenSave').onclick = async (e) => {
    e.preventDefault(); const f2 = view.querySelector('#bbjOpenF'), main = num(f2.main.value), reserve = num(f2.reserve.value);
    if (!f2.day.value || !(main >= 0) || !(reserve >= 0)) { flash(view.querySelector('#bbjOpenMsg'), 'Enter the day, Main and 1st Reserved.', 'err'); return; }
    try { await api('/report/bbj/opening', 'PUT', { day: f2.day.value, main, reserve }); openD.close(); viewReport(view); } catch (err) { flash(view.querySelector('#bbjOpenMsg'), err.message, 'err'); }
  };
  view.querySelectorAll('[data-delpay]').forEach((b) => b.onclick = async () => { if (!confirm('Delete this payout record? The balances will be recalculated.')) return; try { await api('/report/bbj/payout/' + b.dataset.delpay, 'DELETE'); viewReport(view); } catch (err) { alert(err.message); } });
  const bc = view.querySelector('#bbjCsv');
  if (bc) bc.onclick = () => {
    const lines = [['Date', 'Collected PHP', 'Admin fee 30% PHP', 'Pagcor 25% of fee PHP', 'CDC 5% of fee PHP', 'Everest 70% of fee PHP', 'After deduction 70% PHP', 'Main PHP', 'Reserved PHP', 'Paid out PHP', 'Main balance PHP', '1st Reserved balance PHP', 'Note', 'Entered by']]
      .concat([['Before ' + d.from, '', '', '', '', '', '', '', '', '', J.before.main, J.before.reserve, '', '']])
      .concat(J.rows.map((r) => r.kind === 'payout' ? [r.day, '', '', '', '', '', '', '', '', r.paid, r.main_balance, r.reserve_balance, 'Jackpot paid' + (r.note ? ': ' + r.note : ''), r.by] : [r.day, r.amount, r.taken, r.pagcor, r.cdc, r.everest, r.pot, r.to_main, r.to_reserve, '', r.main_balance, r.reserve_balance, '', r.by]))
      .concat([['Total', J.totals.amount, J.totals.taken, J.totals.pagcor, J.totals.cdc, J.totals.everest, J.totals.pot, J.totals.main, J.totals.reserve, J.totals.paid || '', J.balance.main, J.balance.reserve, '', '']]);
    const csv = lines.map((row) => row.map((c) => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })); a.download = `everest-bbj-ledger-${d.from}-to-${d.to}.csv`; a.click();
  };
}

// ---------- Rewards waiting for a manager ----------
async function refreshPending() {
  try { const n = (await api('/rewards/pending')).rewards.length + (isMaster() ? (await api('/change-requests?status=pending')).requests.length : 0); const pill = document.getElementById('pendingPill'); if (pill) { pill.textContent = n; pill.hidden = !n; } } catch (e) {}
}
async function viewApprovals(view) {
  const data = await api('/rewards/pending');
  const cr = isManager() ? await api('/change-requests?status=pending') : { requests: [] };
  const crDone = isManager() ? (await api('/change-requests?status=approved')).requests.concat((await api('/change-requests?status=rejected')).requests).sort((a, b) => b.decided_at - a.decided_at).slice(0, 15) : [];
  const total = data.rewards.reduce((a, r) => a + r.amount, 0);
  view.innerHTML = `<div><h1>Rewards waiting for approval</h1><p class="sub">Rewards recorded by staff count in cost totals only after a manager approves them.${isManager() ? '' : ' A manager will review these.'}</p></div>
    <div class="grid">${tile('Waiting', String(data.rewards.length), peso(total) + ' in total')}</div>
    <section class="card"><div class="tbl"><table><thead><tr><th>Date</th><th>Member</th><th>Type</th><th>Detail</th><th class="num">Value</th><th>Group</th><th>Recorded by</th><th></th></tr></thead><tbody>
    ${data.rewards.map((r) => `<tr><td>${day(r.given_at)}</td><td><a href="#/member/${encodeURIComponent(r.member_no)}"><b>${esc(r.name)}</b></a><div class="small muted mono">${esc(r.member_no)}</div></td><td><span class="chip ${TYPE_CHIP[r.type]}">${TYPES[r.type]}</span></td><td>${esc(r.detail)}</td><td class="num"><b>${peso(r.amount)}</b></td><td>${groupChip(r.group_name)}</td><td class="muted">${esc(r.recorded_by)}</td>
      <td class="row" style="flex-wrap:nowrap">${isManager() ? `<button class="btn sm primary" data-ok="${r.id}">Approve</button>` : ''}${isMaster() ? `<button class="btn sm" data-no="${r.id}">Void</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">Nothing waiting.</td></tr>'}
    </tbody></table></div></section>
    ${isManager() ? `<h1 style="margin-top:28px">Changes waiting for the master</h1><p class="sub">Managers ask to edit, move, unlink or delete a game session; nothing changes until the master account approves.</p>
    <section class="card"><div class="tbl"><table><thead><tr><th>#</th><th>Asked</th><th>Member</th><th>Change</th><th>Reason</th><th></th></tr></thead><tbody>
      ${cr.requests.map((r) => `<tr><td class="mono">${r.id}</td><td class="small"><b>${esc(r.requested_by)}</b><div class="muted">${fmt(r.requested_at, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false })}</div></td>
        <td>${r.member_no ? `<a class="mono" href="#/member/${encodeURIComponent(r.member_no)}">${esc(r.member_no)}</a> ${esc(r.nickname || '')}` : '—'}</td><td class="small">${esc(r.summary)}</td><td class="small">${esc(r.reason)}</td>
        <td class="row" style="flex-wrap:nowrap">${isMaster() ? `<button class="btn sm primary" data-cr-ok="${r.id}">Approve</button><button class="btn sm danger" data-cr-no="${r.id}">Reject</button>` : (r.requested_by === staff ? `<button class="btn sm" data-cr-cancel="${r.id}">Withdraw</button>` : '<span class="chip amber">Waiting</span>')}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No changes waiting.</td></tr>'}
    </tbody></table></div></section>
    <section class="card"><h2 style="margin-bottom:8px">Recently decided</h2><div class="tbl"><table><thead><tr><th>#</th><th>Change</th><th>Asked by · reason</th><th>Decision</th></tr></thead><tbody>
      ${crDone.map((r) => `<tr><td class="mono">${r.id}</td><td class="small">${esc(r.summary)}</td><td class="small"><b>${esc(r.requested_by)}</b> · ${esc(r.reason)}</td><td class="small"><span class="chip ${r.status === 'approved' ? 'green' : 'red'}">${r.status}</span> ${esc(r.decided_by || '')} · ${fmt(r.decided_at, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false })}${r.decision_note ? `<div class="muted">${esc(r.decision_note)}</div>` : ''}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Nothing yet.</td></tr>'}
    </tbody></table></div></section>` : ''}`;
  view.querySelectorAll('[data-cr-ok]').forEach((b) => b.onclick = async () => { if (!confirm('Approve and apply change #' + b.dataset.crOk + '?')) return; try { await api('/change-requests/' + b.dataset.crOk + '/approve', 'POST', {}); viewApprovals(view); refreshPending(); } catch (e) { alert(e.message); } });
  view.querySelectorAll('[data-cr-no]').forEach((b) => b.onclick = async () => { const note = prompt('Reject change #' + b.dataset.crNo + '? Optional note for the manager:'); if (note === null) return; try { await api('/change-requests/' + b.dataset.crNo + '/reject', 'POST', { note }); viewApprovals(view); refreshPending(); } catch (e) { alert(e.message); } });
  view.querySelectorAll('[data-cr-cancel]').forEach((b) => b.onclick = async () => { if (!confirm('Withdraw your request #' + b.dataset.crCancel + '?')) return; try { await api('/change-requests/' + b.dataset.crCancel + '/cancel', 'POST', {}); viewApprovals(view); refreshPending(); } catch (e) { alert(e.message); } });
  view.querySelectorAll('[data-ok]').forEach((b) => b.onclick = async () => { try { await api('/rewards/' + b.dataset.ok + '/approve', 'POST', {}); viewApprovals(view); refreshPending(); } catch (e) { alert(e.message); } });
  view.querySelectorAll('[data-no]').forEach((b) => b.onclick = async () => {
    const reason = (prompt('Why is this reward being voided?') || '').trim(); if (!reason) return;
    try { await api('/rewards/' + b.dataset.no + '/void', 'POST', { reason }); viewApprovals(view); refreshPending(); } catch (e) { alert(e.message); }
  });
}

  const { staff: list } = await api('/staff');
  view.innerHTML = `<div><h1>Staff accounts</h1><p class="sub">Everyone signs in with their own account to the console, PPM and the waiting list. <b>Master</b>: everything, including group changes, voids, imports, suspensions and these accounts. <b>Manager</b>: approve rewards and edit promotions. <b>Staff</b>: look up, add members, record rewards.</p></div>
    <div id="sm"></div>
    <section class="card"><h2 style="margin-bottom:10px">New account</h2>
      <form id="nf2" class="form"><label class="f">Username<input type="text" name="username" required maxlength="60" autocomplete="off"></label>
        <label class="f">Password<input type="text" name="password" required minlength="6" maxlength="200" autocomplete="new-password"></label>
        <label class="f">Role<select name="role"><option value="staff">Staff</option><option value="admin">Manager</option></select></label>
        <div style="align-self:end"><button class="btn primary">Create account</button></div></form></section>
    <section class="card"><div class="tbl"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>
    ${list.map((a, i) => `<tr><td><b>${esc(a.display_name)}</b>${a.display_name.toLowerCase() === staff.toLowerCase() ? ' <span class="small muted">(you)</span>' : ''}</td>
      <td>${a.role === 'master' ? '<span class="chip" style="background:var(--gold);color:#1B1406">Master</span>' : `<select data-role="${i}"><option value="staff" ${a.role === 'staff' ? 'selected' : ''}>Staff</option><option value="admin" ${a.role === 'admin' ? 'selected' : ''}>Manager</option></select>`}</td>
      <td>${a.active ? '<span class="chip green">Active</span>' : '<span class="chip red">Disabled</span>'}</td><td class="muted">${day(a.created_at)}</td>
      <td class="row" style="flex-wrap:nowrap"><button class="btn sm" data-pw="${i}">Reset password</button>${a.role === 'master' ? '' : `<button class="btn sm ${a.active ? 'danger' : ''}" data-act="${i}">${a.active ? 'Disable' : 'Enable'}</button><button class="btn sm danger" data-del="${i}">Delete</button>`}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No accounts yet.</td></tr>'}
    </tbody></table></div></section>`;
  const msg = view.querySelector('#sm');

  view.querySelector('#nf2').onsubmit = async (e) => {
    e.preventDefault(); const f = e.target;
    try { await api('/staff', 'POST', { username: f.username.value.trim(), password: f.password.value, role: f.role.value }); flash(msg, `Created ${f.username.value.trim()}.`, 'ok'); setTimeout(() => viewStaff(view), 700); }
    catch (err) { flash(msg, err.message, 'err'); }
  };
  view.querySelectorAll('[data-role]').forEach((sel) => sel.onchange = () => put(list[sel.dataset.role], { role: sel.value }, 'Role updated.'));
  view.querySelectorAll('[data-pw]').forEach((b) => b.onclick = () => { const a = list[b.dataset.pw]; const pw = prompt(`New password for ${a.display_name} (at least 6 characters):`); if (pw) put(a, { password: pw }, `Password reset for ${a.display_name}. They are signed out everywhere.`); });
  view.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => {
    const a = list[b.dataset.del];
    if (!confirm(`Delete the account ${a.display_name}? They can no longer sign in. Their name stays in past records.`)) return;
    try { await api('/staff/' + encodeURIComponent(a.username) + '/delete', 'POST', {}); flash(msg, `Deleted ${a.display_name}.`, 'ok'); setTimeout(() => viewStaff(view), 700); } catch (err) { flash(msg, err.message, 'err'); }
  });
  view.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => { const a = list[b.dataset.act]; if (a.active && !confirm(`Disable ${a.display_name}? They are signed out at once.`)) return; put(a, { active: !a.active }, a.active ? 'Account disabled.' : 'Account enabled.'); });
}

// ---------- Promotions shown in the member app ----------
async function viewPromotions(view) {
  const { promotions } = await api('/promotions');
  const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Manila' }).format(new Date());
  const live = (p) => p.active && (!p.starts || p.starts <= today) && (!p.ends || p.ends >= today);
  const form = (p) => `<form class="form" data-id="${p ? p.id : ''}" style="background:#F6F7F9;border-radius:10px;padding:14px">
      <label class="f wide">Title<input type="text" name="title" maxlength="120" required value="${esc(p ? p.title : '')}" ${isManager() ? '' : 'disabled'}></label>
      <label class="f">Starts<input type="date" name="starts" value="${esc(p ? p.starts : '')}" ${isManager() ? '' : 'disabled'}></label>
      <label class="f">Ends<input type="date" name="ends" value="${esc(p ? p.ends : '')}" ${isManager() ? '' : 'disabled'}></label>
      <label class="f" style="grid-column:1/-1">Details<textarea name="body" rows="2" maxlength="1000" ${isManager() ? '' : 'disabled'}>${esc(p ? p.body : '')}</textarea></label>
      <label class="f">Order<input type="number" name="sort" value="${p ? p.sort : 0}" ${isManager() ? '' : 'disabled'}></label>
      <label class="f" style="flex-direction:row;align-items:center;gap:8px;align-self:end"><input type="checkbox" name="active" ${!p || p.active ? 'checked' : ''} ${isManager() ? '' : 'disabled'} style="height:auto"> Show to members</label>
      ${isManager() ? `<div style="align-self:end"><button class="btn ${p ? '' : 'primary'}">${p ? 'Save' : 'Add promotion'}</button></div>` : ''}
    </form>`;
  view.innerHTML = `<div><h1>Promotions</h1><p class="sub">What members see under "Promotions" in the member app. Leave dates empty to show it until you turn it off.${isManager() ? '' : ' Only managers can edit.'}</p></div>
    <div id="pm"></div>
    ${isManager() ? `<section class="card"><h2 style="margin-bottom:10px">New promotion</h2>${form(null)}</section>` : ''}
    ${promotions.map((p) => `<section class="card"><div class="row between" style="margin-bottom:10px"><h2>${esc(p.title)}</h2><span class="chip ${live(p) ? 'green' : ''}">${live(p) ? 'Showing now' : 'Not showing'}</span></div>${form(p)}</section>`).join('') || '<p class="muted">No promotions yet.</p>'}`;
  view.querySelectorAll('form[data-id]').forEach((f) => f.onsubmit = async (e) => {
    e.preventDefault();
    const body = { title: f.title.value, starts: f.starts.value, ends: f.ends.value, body: f.body.value, sort: Number(f.sort.value) || 0, active: f.active.checked };
    try { await api('/promotions' + (f.dataset.id ? '/' + f.dataset.id : ''), f.dataset.id ? 'PUT' : 'POST', body); viewPromotions(view); }
    catch (err) { flash(view.querySelector('#pm'), err.message, 'err'); }
  });
}

// ---------- Unmatched PPM names ----------
// Link, and if the typed name does not look like the member, ask once before linking anyway.
async function linkWithCheck(path, body) {
  try { return await api(path, 'POST', body); }
  catch (e) {
    if (e.code !== 'name_mismatch') throw e;
    if (!confirm(e.message + '\n\nLink anyway?')) { const c = new Error('Not linked.'); c.cancelled = true; throw c; }
    return api(path, 'POST', { ...body, confirm: true });
  }
}
let unmatchedTimer = null;
// PPM CSV (zh or en headers) -> session rows for /sessions/import-ppm.
const PPM_COLS = { date: ['日期', 'date'], table: ['桌號', 'table'], seat: ['席次', 'seat'], member: ['會員 id', 'member id'], start: ['上桌時間', 'start time'], end: ['下桌時間', 'end time'],
  active: ['上桌秒數', 'active seconds'], rest: ['休息秒數', 'rest seconds'], buy_in: ['買碼', 'buy-in'], cash_out: ['結碼金額', 'cash-out'] };
function parsePpmCsv(text) {
  const table = parseCsv(text.replace(/^﻿/, ''));
  const blindsRow = table.find((r) => /^(blinds|盲注)/i.test((r[0] || '').trim()));
  const hi = table.findIndex((r) => r.some((c) => ['會員 id', 'member id'].includes(c.trim().toLowerCase())));
  if (hi < 0) return { rows: [], blinds: '' };
  const head = table[hi].map((h) => h.trim().toLowerCase());
  const col = {}; for (const [k, names] of Object.entries(PPM_COLS)) col[k] = head.findIndex((h) => names.includes(h));
  const rows = table.slice(hi + 1).filter((r) => r[col.member] && r[col.start]).map((r) => Object.fromEntries(Object.entries(col).map(([k, i]) => [k, i >= 0 ? (r[i] || '').trim() : ''])));
  return { rows, blinds: blindsRow ? (blindsRow[1] || '').trim() : '' };
}
function bindPpmRecover(view) {
  const input = view.querySelector('#ppmcsv'); if (!input) return;
  input.onchange = async () => {
    const file = input.files[0]; if (!file) return;
    const { rows, blinds } = parsePpmCsv(await file.text());
    const msg = view.querySelector('#ppmMsg'), box = view.querySelector('#ppmRows');
    if (!rows.length) { msg.textContent = 'No session rows found. Use the CSV that PPM downloads at Close or Reset.'; return; }
    const show = (res) => {
      const label = (r) => r.status === 'recorded' ? `<span class="chip green">Recorded</span> ${r.member_no ? `<a class="mono" href="#/member/${encodeURIComponent(r.member_no)}">${esc(r.member_no)}</a>` : 'Unmatched'}`
        : r.status === 'deleted' ? '<span class="chip">Deleted by master</span>' : `<span class="chip amber">Missing</span> → ${r.will_go_to ? `<span class="mono">${esc(r.will_go_to)}</span>` : 'Unmatched (link it after)'}`;
      const missing = res.rows.filter((r) => r.status === 'missing').length;
      box.innerHTML = `<div class="tbl"><table><thead><tr><th style="width:36px"><span class="sr">Add</span></th><th>Table · Seat</th><th>Typed in PPM</th><th>Start – End</th><th class="num">Buy-in</th><th class="num">Cash-out</th><th>In the system</th></tr></thead><tbody>
        ${res.rows.map((r, i) => `<tr><td>${r.status === 'missing' ? `<input type="checkbox" data-pick="${i}" checked aria-label="Add this session">` : ''}</td><td>${esc(r.table)} · S${esc(r.seat)}</td><td>${esc(r.member)}</td><td class="mono small">${esc(r.start)} → ${esc(r.end.slice(11))}</td><td class="num">${r.buy_in == null ? '—' : peso(r.buy_in)}</td><td class="num">${r.cash_out == null ? '—' : peso(r.cash_out)}</td><td>${label(r)}</td></tr>`).join('')}</tbody></table></div>
        ${missing ? `<div class="row" style="margin-top:10px"><button class="btn primary" id="ppmGo">Add ticked sessions</button><span class="small muted">Untick a session you already entered by hand.</span></div>` : '<p class="small muted" style="margin:8px 0 0">Everything in this file is already in the system.</p>'}`;
      const go = box.querySelector('#ppmGo');
      if (go) go.onclick = async () => {
        const picked = new Set([...box.querySelectorAll('[data-pick]:checked')].map((c) => Number(c.dataset.pick)));
        const keyOf = (r) => [r.table, String(r.seat), r.member, r.start, r.end].join('|');
        const want = new Set(res.rows.filter((r, i) => r.status === 'missing' && picked.has(i)).map(keyOf));
        const send = rows.filter((r) => want.has(keyOf({ table: r.table, seat: String(Number(r.seat) || 0), member: r.member, start: r.start, end: r.end })));
        if (!send.length) { msg.textContent = 'Nothing ticked.'; return; }
        go.disabled = true;
        try { const r = await api('/sessions/import-ppm', 'POST', { rows: send, blinds }); msg.textContent = `${r.imported} session${r.imported === 1 ? '' : 's'} added.`; show(await api('/sessions/import-ppm', 'POST', { rows, blinds, dry_run: true })); } catch (e) { msg.textContent = e.message; go.disabled = false; }
      };
    };
    msg.textContent = `${rows.length} sessions in ${file.name}${blinds ? ' · ' + blinds : ''}`;
    try { show(await api('/sessions/import-ppm', 'POST', { rows, blinds, dry_run: true })); } catch (e) { msg.textContent = e.message; }
  };
}

    <section class="card"><div class="row between" style="margin-bottom:10px"><h2>Already left the table</h2></div>
    <div class="tbl"><table><thead><tr><th>Typed in PPM</th><th class="num">Sessions</th><th class="num">Playing hours</th><th>Last seen</th><th style="min-width:280px">Link to member</th></tr></thead><tbody>
    ${data.refs.map((r, i) => `<tr><td><b>${esc(r.member_ref)}</b></td><td class="num">${r.sessions}</td><td class="num">${hm(r.secs)}</td><td class="muted">${day(r.last)}</td>
      <td><form class="row" data-i="${i}" style="flex-wrap:nowrap">${box('u' + i, '6-digit member no., e.g. 444444')}<button class="btn sm">Link</button></form></td></tr>`).join('') || '<tr><td colspan="5" class="muted">Nothing to link.</td></tr>'}
    </tbody></table></div></section>
    ${isMaster() ? `<section class="card"><h2>Recover sessions from a PPM CSV <span class="chip dark small">Master</span></h2>
      <p class="small muted" style="margin:6px 0 10px">If a finished session is in the CSV that PPM downloaded (at Close or Reset) but not in the member system, load that CSV here. Sessions already recorded are left alone.</p>
      <div class="row"><input type="file" id="ppmcsv" accept=".csv,text/csv"><span id="ppmMsg" class="small"></span></div><div id="ppmRows" style="margin-top:10px"></div></section>` : ''}`;
  const msg = view.querySelector('#um');
  view.querySelectorAll('form[data-s]').forEach((f) => {
    const input = f.querySelector('input'); memberPicker(input);
    f.onsubmit = async (e) => {
      e.preventDefault(); const x = data.seated[Number(f.dataset.s)];
      try { const res = await linkWithCheck('/sessions/link-seat', { seat_key: x.seat_key, member_no: input.value.trim() }); flash(msg, `${x.ref} (${x.table} · S${x.seat}) will count for ${res.member_no} when they leave.`, 'ok'); setTimeout(() => viewUnmatched(view), 600); }
      catch (err) { flash(msg, err.message, err.cancelled ? '' : 'err'); }
    };
  });
  view.querySelectorAll('form[data-i]').forEach((f) => {

    f.onsubmit = async (e) => {

    viewUnmatched(view).catch(() => {});
  }, 30000);
}

// ---------- Import from the Google Sheet ----------
const HEADER_MAP = { surname: 'surname', firstname: 'surname', 'first name': 'surname', middlename: 'middle_name', 'middle name': 'middle_name', familyname: 'family_name', 'family name': 'family_name', lastname: 'family_name', 'last name': 'family_name',
  nickname: 'nickname', 'nick name': 'nickname', nationality: 'nationality', birthday: 'birthday', 'date of birth': 'birthday', passportid: 'passport_id', passport: 'passport_id', 'passport id': 'passport_id',
  email: 'email', phone: 'phone', whatsapp: 'whatsapp', telegram: 'telegram', line: 'line', referralid: 'referral_id', 'referral id': 'referral_id', language: 'language',
  memberid: 'member_no', 'member id': 'member_no', 'member no': 'member_no', memberno: 'member_no', '會員號碼': 'member_no', remark: 'staff_notes', remarks: 'staff_notes', note: 'staff_notes', notes: 'staff_notes', '備註': 'staff_notes', group: 'group', host: 'group', '場主': 'group', submittedat: 'created', 'submitted at': 'created', timestamp: 'created' };
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ',' || c === '\t') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim()));
}
function normDate(v) {
  v = String(v || '').trim(); if (!v) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
  const d = new Date(v); return isNaN(d) ? v : new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Manila' }).format(d);
}
const IMPORT_GUIDE = [
  ['Member ID', 'Optional', '6 digits, e.g. 000123. Leave blank to give the next free number automatically.'],
  ['Surname', 'Name or Nickname', 'As on the passport.'], ['Middle Name', 'Optional', ''], ['Family Name', 'Name or Nickname', 'As on the passport.'],
  ['Nickname', 'Name or Nickname', 'The name staff type in PPM.'],
  ['Nationality', 'Optional', 'Country name, e.g. Taiwan, South Korea, Philippines. "Taiwanese", "Korean" etc. are converted.'],
  ['Birthday', 'Optional', 'YYYY-MM-DD, e.g. 1988-04-17. The member app uses it to sign in.'],
  ['Passport ID', 'Optional', 'Used to skip a person who is already a member.'],
  ['Phone', 'Optional', 'With country code, e.g. +63 917 555 1234.'], ['Email', 'Optional', ''], ['WhatsApp', 'Optional', ''], ['Telegram', 'Optional', 'e.g. @username'], ['LINE', 'Optional', ''],
  ['Language', 'Optional', 'e.g. English, 中文, Korean, Japanese.'], ['Referral ID', 'Optional', 'Member ID of whoever brought them.'],
  ['Group', 'Optional', 'Hee, Dee, SK, Patrick, JOY or In-House.'], ['Remark', 'Optional', 'Anything the team should know.']
];
function downloadImportSample() {

    ['', 'Wei-Lun', '', 'Chen', 'Wei', 'Taiwan', '1988-04-17', '', '+886 912 345 678', 'wei@example.com', '', '@weichen', 'weilun88', '中文', '', 'Hee', 'Prefers Table 3'],
    ['000150', 'Ji-ho', '', 'Park', 'Jiho', 'South Korea', '1992-11-02', '', '+82 10 1234 5678', '', '', '', '', 'Korean', '', 'In-House', '']];
  const csv = rows.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })); a.download = 'everest-member-import-sample.csv'; a.click();
}
async function viewImport(view) {
  view.innerHTML = `<div class="row between" style="align-items:flex-end"><div><h1>Import members</h1><p class="sub">Fill in the sample file (Excel or Google Sheets), save it as CSV, and upload it here. Existing member numbers and passports are skipped, so importing twice is safe.</p></div>
    <button class="btn primary" id="sample">Download sample CSV</button></div>
    <section class="card"><h2 style="margin-bottom:8px">Columns</h2><div class="tbl"><table><thead><tr><th>Column</th><th>Required?</th><th>How to fill it</th></tr></thead><tbody>
      ${IMPORT_GUIDE.map(([c, req, how]) => `<tr><td><b>${esc(c)}</b></td><td>${req}</td><td class="small">${esc(how)}</td></tr>`).join('')}
    </tbody></table></div><p class="small muted" style="margin:8px 0 0">Keep the header row as it is; column order does not matter and unknown columns are ignored. In Excel use File → Save As → <b>CSV UTF-8</b> so Chinese, Korean and Japanese names stay readable.</p></section>
    <section class="card" style="display:flex;flex-direction:column;gap:12px">
      <label class="f">CSV file<input type="file" id="file" accept=".csv,text/csv,.tsv,text/tab-separated-values"></label>
      <label class="f">…or paste the rows (with the header row)<textarea id="paste" rows="6" placeholder="surname,middleName,familyName,nickName,…"></textarea></label>
      <div class="row"><button class="btn" id="preview">Preview</button></div><div id="pv"></div></section>`;
  view.querySelector('#sample').onclick = downloadImportSample;
  let rows = [];
  const show = (text) => {
    const table = parseCsv(text); if (table.length < 2) return flash(view.querySelector('#pv'), 'No rows found.', 'err');
    const head = table[0].map((h) => HEADER_MAP[h.trim().toLowerCase()] || HEADER_MAP[h.trim().toLowerCase().replace(/[_\s]/g, '')] || null);
    rows = table.slice(1).map((r) => { const o = {}; head.forEach((k, i) => { if (k) o[k] = (r[i] || '').trim(); }); if (o.birthday) o.birthday = normDate(o.birthday); if (o.created) o.created = normDate(o.created); return o; });
    const used = [...new Set(head.filter(Boolean))], ignored = table[0].filter((h, i) => !head[i]);

      <div class="tbl" style="margin-top:10px"><table><thead><tr>${used.map((k) => `<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0, 5).map((r) => `<tr>${used.map((k) => `<td>${k === 'passport_id' && r[k] ? '••••' + esc(r[k].slice(-4)) : esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="small muted">Showing the first 5. Rows without a "Member ID" column get the next EV- number. A "Group" column (Hee, Dee, SK, Patrick, JOY, In-House) assigns the group.</p>
      <div class="row"><button class="btn primary" id="go">Import ${rows.length} rows</button><span id="prog"></span></div>`;
    view.querySelector('#go').onclick = async () => {
      const who = needStaff(); if (!who) return; const btn = view.querySelector('#go'); btn.disabled = true;
      const total = { created: 0, skipped: 0, errors: [] };
      for (let i = 0; i < rows.length; i += 50) {

        catch (err) { total.errors.push({ row: `${i + 2}–${i + 51}`, error: err.message }); }
      }

      view.querySelector('#prog').innerHTML = `<b>${total.created} created</b>, ${total.skipped} already existed${total.errors.length ? `, ${total.errors.length} problems:<ul>${total.errors.map((e) => `<li>Sheet row ${esc(e.row)}: ${esc(e.error)}</li>`).join('')}</ul>` : '.'}`;
    };
  };
  view.querySelector('#file').onchange = async (e) => { const f = e.target.files[0]; if (f) show(await f.text()); };
  view.querySelector('#preview').onclick = () => show(view.querySelector('#paste').value);
}
