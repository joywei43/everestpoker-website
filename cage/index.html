<style>

@media (prefers-color-scheme:dark){button.o-buy{color:#6FD39A}button.o-out{color:#F28B82}button.o-ins{color:#8AB4F8}}

<body>
<header><div class="wrap top"><h1>Everest Cage</h1>
<nav id="nav"></nav><span class="status sub" id="status">Connecting…</span><span class="sub" id="who" style="margin-left:10px"></span><button class="link" id="logout" style="display:none;margin-left:6px">Log out</button></div></header>
<div id="login" style="display:none;max-width:360px;margin:12vh auto 0;padding:0 16px"><img src="/admin/logo.png" alt="" style="width:56px"><h2>Everest Cage</h2><div class="sub">Sign in with your staff account.</div><form id="lf"><input id="un" placeholder="Username" autocomplete="username" style="margin-top:10px"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:10px"><div class="err" id="lerr"></div><button class="primary" style="margin-top:12px;width:100%">Sign in</button></form></div>
<main class="wrap" id="app"></main>
<script>
/* ---------- constants ---------- */
const POUCHES=[{k:'cf',l:'Cash float',media:['cash']},{k:'ins',l:'Insurance',media:['cash','chips']},{k:'chip',l:'Chip float',media:['chips']},{k:'day',l:'On-day cash',media:['cash']},{k:'pd',l:'Player deposits (held)',media:['cash'],held:true}];
const MED={cash:'Cash',chips:'Chips'};
const TABLES=['PO1','PO2','PO3','PO5'];
const EXP_CATS=['Player hospitality','Promo prizes','Staff housing','Staff allowance','Supplies and transport','F&B purchases','Renovation and equipment','Junket share','Other expenses'];
const INC_CATS=['F&B sales','Refunds','Other income'];
const TYPES=[
 {k:'expense',l:'Expense',d:'Pay money out of a pouch'},
 {k:'income',l:'Income',d:'Money received into a pouch'},
 {k:'buyback',l:'BBJ / Rake payment',d:'Pay MIDORI cash for BBJ / Rake chips'},
 {k:'midori_pay',l:'MIDORI settlement',d:'Monthly rake / BBJ payment received'},
 {k:'owner',l:'Owner in / out',d:'Owner puts in or takes out money'},
 {k:'ar_in',l:'Receivable collected',d:'Money owed to us comes in'},
 {k:'ap_out',l:'Payable paid',d:'Money we owe is paid'}];
const SYS_TYPES={count_adj:'Count difference',chip_transfer:'Chip transfer',fx_release:'Foreign cash lock released',other_out:'Cash out · other',fx_in:'Foreign cash in',fx_out:'Foreign cash out',chip_short:'BBJ / Rake',transfer:'Transfer',ins:'Insurance win/loss',behind:'Playing behind',buyin:'Player buy-in',cashout:'Player cash-out',ins_settle:'Insurance chips → cash',p_deposit:'Player deposit',p_withdraw:'Player withdrawal',op_out:'Cash out (operation)',op_in:'Cash in (operation)',swap_c2ch:'Cash → chips',swap_ch2c:'Chips → cash',ins_move:'Insurance → chips/cash',mass_redeem:'Redeem mass chips',mass_close:'Close: mass chips → on-day cash',tips_out:'Close: tips → tip reserves',tip_pay:'Tips paid',day_close:'Cash in · On-day buy-in',close_day:'Close: on-day net income',behind:'Playing behind'};
const typeLabel=k=>(TYPES.find(x=>x.k===k)||{}).l||SYS_TYPES[k]||k;
const CASH_D=[1000,500,100,50,20,10,5,1];const CHIP_D=[10000,1000,100,25];const HOUSE_D=25;const chipVal=d=>Number(d)===HOUSE_D?0:Number(d);
const houseQty=c=>Object.values((c&&c.chips)||{}).reduce((s,x)=>s+(Number((x||{})[HOUSE_D])||0),0);
const DEFAULT_SETTINGS={openDate:'2026-11-01',rent:0,pagcorMin:0,pagcorRate:.25,cdcRate:.05,everestRakeRate:.70,bbjEverestRate:.21,
 fxRates:{TWD:1.8,USD:60},open:{cf_cash:0,pd_cash:0,ins_cash:0,ins_chips:0,day_cash:0,bb_cash:0,chip_chips:0,chipsOut:0,mass_chips:0,box:0,fx_TWD:0,fx_USD:0},owners:[],supervisors:['Joy','Geraldine','Cey','Phoebe']};

/* ---------- state ---------- */
let DB=null,MEM=false;
const S={dayOverride:(()=>{try{return sessionStorage.getItem('cage-day')||null}catch(e){return null}})(),tab:'counts',cw:null,manpower:{},mpMonth:null,counts:[],cnt:null,qa:null,qaMsg:null,recDay:null,ppm:{},entries:[],players:[],midori:{},settings:null,month:null,type:'expense',form:{},pending:null,playerSel:null,ledgerFilter:{pouch:'',type:'',month:''},loaded:{e:false,p:false,m:false,s:false,c:false}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2=n=>Math.round(n*100)/100;
const peso=n=>(n<0?'−':'')+'₱'+Math.abs(round2(n)).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const sgn=n=>(n>0?'+':n<0?'−':'')+Math.abs(round2(n)).toLocaleString('en-US',{maximumFractionDigits:2});
const num=v=>{const n=Number(String(v??'').replace(/[,₱\s]/g,''));return Number.isFinite(n)?n:NaN};
const z=n=>String(n).padStart(2,'0');
const bizDay=(d)=>{if(d===undefined&&S.dayOverride)return S.dayOverride;const x=d?new Date(d):new Date();if(x.getHours()<12)x.setDate(x.getDate()-1);return `${x.getFullYear()}-${z(x.getMonth()+1)}-${z(x.getDate())}`};
const monthOf=d=>String(d||'').slice(0,7);
const FX_CUR=['TWD','USD'];const fxRate=(c,st=settings())=>Number(((st.fxRates)||{})[c]||{TWD:1.8,USD:60}[c]);
const fxLine=f=>FX_CUR.filter(c=>Math.abs((f[c]||{}).amt||0)>0.001).map(c=>`${c} ${f[c].amt.toLocaleString('en-US')} (${pesoE(f[c].php)})`).join(' · ')||'None';
const settings=()=>({...DEFAULT_SETTINGS,...(S.settings||{}),open:{...DEFAULT_SETTINGS.open,...((S.settings||{}).open||{})}});
const pouchName=k=>(POUCHES.find(p=>p.k===k)||{}).l||k;
const playerName=id=>(S.players.find(p=>p.id===id)||{}).name||'(deleted player)';

/* ---------- money logic ---------- */
function liveEntries(){return S.entries.filter(e=>!e.voided)}
function balances(upTo){
 const st=settings(),o=st.open;
 const b={mass_chips:Number(o.mass_chips||0),cf_cash:o.cf_cash,ins_cash:o.ins_cash,ins_chips:o.ins_chips,day_cash:Number(o.day_cash||0),pd_cash:Number(o.pd_cash||0),bb_cash:Number(o.bb_cash||0),chip_chips:o.chip_chips,ar:{},ap:{},pbBy:{},fx:Object.fromEntries(FX_CUR.map(c=>{const n=Number(o['fx_'+c]||0);return [c,{amt:n,php:round2(n*fxRate(c,st))}]})),dep:{},loan:{},owner:{},behind:0,box:Number(o.box||0)};
 for(const p of S.players){b.dep[p.id]=Number(p.openDep||0);b.loan[p.id]=Number(p.openLoan||0)}
 for(const p of S.players)if(!p.account&&p.under&&S.players.some(h=>h.id===p.under&&h.account)){b.dep[p.under]=(b.dep[p.under]||0)+(b.dep[p.id]||0)-(b.loan[p.id]||0);b.dep[p.id]=0;b.loan[p.id]=0}
 for(const x of (st.arap||[])){const v=Number(x.amt||0);if(x.kind==='ar')b.ar[x.name]=(b.ar[x.name]||0)+v;else if(x.kind==='ap')b.ap[x.name]=(b.ap[x.name]||0)+v;else if(x.kind==='pb'){b.behind-=v;b.pbBy[x.name]=(b.pbBy[x.name]||0)+v}}
 for(const e of liveEntries()){
  if(upTo&&e.date>upTo)continue;if(e.date<st.openDate)continue;if(e.type==='ins'&&e.date>=INS_LINK)continue;
  for(const g of e.legs||[]){
   if(g.a==='dep')b.dep[g.p]=(b.dep[g.p]||0)+g.v;
   else if(g.a==='loan')b.loan[g.p]=(b.loan[g.p]||0)+g.v;
   else if(g.a==='owner')b.owner[g.p]=(b.owner[g.p]||0)+g.v;
   else if(g.a==='behind')b.behind+=g.v;
   else if(g.a==='ar'||g.a==='ap')b[g.a][g.p]=round2((b[g.a][g.p]||0)+g.v);
   else if(g.a==='box')b.box+=g.v;
   else if(g.a==='fx'){const f=b.fx[g.cur]=b.fx[g.cur]||{amt:0,php:0};f.amt=round2(f.amt+g.fv);f.php=round2(f.php+g.v)}
   else if(g.a==='tipsheld'){b.tipsheld=(b.tipsheld||0)+g.v;if(g.p){b.tipsBy=b.tipsBy||{};b.tipsBy[g.p]=(b.tipsBy[g.p]||0)+g.v}}
   else{const k=g.a+'_'+g.m;b[k]=(b[k]||0)+g.v}
  }}
 const il=insLive();if(il)for(const [d,x] of Object.entries(il.days)){if(d<st.openDate||d<INS_LINK||(upTo&&d>upTo))continue;b.ins_chips=round2((b.ins_chips||0)+x.net)}
 return b}
function midoriMonth(m){
 const st=settings();const days=Object.entries(S.midori).filter(([d])=>monthOf(d)===m).sort();
 const tbl={};let R=0,B=0;
 for(const [d,v] of days){for(const t of TABLES){const r=Number((v.rake||{})[t]||0),bb=Number((v.bbj||{})[t]||0);R+=r;B+=bb;tbl[t]=tbl[t]||{r:0,b:0};tbl[t].r+=r;tbl[t].b+=bb}}
 const pag=R*st.pagcorRate,short=Math.max(0,st.pagcorMin-pag);
 const rakeNet=R*st.everestRakeRate-st.rent-short;const bbj21=B*st.bbjEverestRate;
 const settled=liveEntries().filter(e=>e.type==='midori_pay'&&e.forMonth===m);
 const paidRake=settled.reduce((s,e)=>s+Number(e.rakePart||0),0),paidBbj=settled.reduce((s,e)=>s+Number(e.bbjPart||0),0);
 return{days,R,B,pag,short,cdc:R*st.cdcRate,rakeNet,bbj21,paidRake,paidBbj,dueRake:rakeNet-paidRake,dueBbj:bbj21-paidBbj,tbl}}
function allMonths(){const s=new Set([monthOf(bizDay())]);for(const d of Object.keys(S.midori))s.add(monthOf(d));for(const e of S.entries)s.add(monthOf(e.date));return[...s].filter(Boolean).sort().reverse()}
function receivables(){
 const st=settings();let rake=0,bbj=0;const rows=[];
 for(const m of allMonths().slice().reverse()){const x=midoriMonth(m);if(!x.days.length&&!x.paidRake&&!x.paidBbj)continue;rows.push([m,x]);rake+=x.dueRake;bbj+=x.dueBbj}
 return{rows,rake:rake+Number(st.open.arCarry||0),bbj,carry:Number(st.open.arCarry||0)}}

/* ---------- build legs for each entry type ---------- */
function buildEntry(f){
 const t=f.type,a=num(f.amount),legs=[];let pl=null,summary='';const P=f.pouch,M=f.medium;
 const need=(c,msg)=>{if(!c)throw new Error(msg)};
 need(f.date,'Choose the business day.');need(f.date>=settings().openDate||t==='midori_pay',`This business day is before the start date ${settings().openDate}, so it would not count. Put anything before the start date into the starting balances.`);need(a>0,'Enter an amount above 0.');
 const pm=()=>{need(P,'Choose a pouch.');need(M,'Choose cash or chips.');need((POUCHES.find(p=>p.k===P)||{media:[]}).media.includes(M),`${pouchName(P)} has no ${(MED[M]||'').toLowerCase()}.`)};
 switch(t){
  case 'expense':pm();need(f.cat,'Choose a category.');legs.push({a:P,m:M,v:-a});pl={cat:f.cat,v:-a};summary=`${f.cat}: ${peso(a)} paid from ${pouchName(P)} (${MED[M]})`;break;
  case 'income':pm();need(f.cat,'Choose a category.');legs.push({a:P,m:M,v:a});pl={cat:f.cat,v:a};summary=`${f.cat}: ${peso(a)} into ${pouchName(P)} (${MED[M]})`;break;
  case 'midori_pay':{pm();need(f.forMonth,'Choose the month being settled.');const r=num(f.rakePart||0),bb=num(f.bbjPart||0);need(Number.isFinite(r)&&Number.isFinite(bb),'Rake and BBJ must be numbers.');
   need(Math.abs(r+bb-a)<0.01,`Rake ${peso(r)} + BBJ ${peso(bb)} must equal the total ${peso(a)}.`);legs.push({a:P,m:M,v:a});summary=`MIDORI settlement for ${f.forMonth}: ${peso(a)} (rake ${peso(r)}, BBJ ${peso(bb)}) into ${pouchName(P)}`;break}
  case 'buyback':{pm();need(M==='cash','This is paid in cash.');const box=balances().box;need(a<=box+0.001,`Only ${peso(box)} of chips is waiting to be bought back.`);
   legs.push({a:P,m:'cash',v:-a},{a:'chip',m:'chips',v:a},{a:'box',v:-a});summary=`Paid MIDORI ${peso(a)} cash from ${pouchName(P)} for BBJ / Rake chips, into the chip float`;break}
  case 'ar_in':{pm();need(f.who,'Choose who paid.');const have=balances().ar[f.who]||0;need(a<=have+0.001,`${f.who} owes only ${peso(have)}.`);legs.push({a:P,m:M,v:a},{a:'ar',p:f.who,v:-a});summary=`Receivable collected from ${f.who}: ${peso(a)} into ${pouchName(P)} (${MED[M]})`;break}
  case 'ap_out':{pm();need(f.who,'Choose who was paid.');const have=balances().ap[f.who]||0;need(a<=have+0.001,`We owe ${f.who} only ${peso(have)}.`);legs.push({a:P,m:M,v:-a},{a:'ap',p:f.who,v:-a});summary=`Paid ${f.who} ${peso(a)} from ${pouchName(P)} (${MED[M]})`;break}
  case 'owner':pm();need(f.who,'Choose the owner.');need(f.dir,'Choose in or out.');{const v=f.dir==='in'?a:-a;legs.push({a:P,m:M,v},{a:'owner',p:f.who,v});summary=`${f.who} ${f.dir==='in'?'put in':'took out'} ${peso(a)} (${pouchName(P)}, ${MED[M]})`};break;
  default:throw new Error('Unknown type')}
 return{type:t,date:f.date,time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),amount:a,legs,pl,summary,note:(f.note||'').trim(),
  player:f.player||null,cat:f.cat||null,who:f.who||null,period:f.period||null,forMonth:f.forMonth||null,rakePart:f.rakePart?num(f.rakePart):null,bbjPart:f.bbjPart?num(f.bbjPart):null,medium:M||null,createdAt:new Date().toISOString(),voided:false}}

/* ---------- storage ---------- */
async function saveEntry(e){if(MEM){e.id='m'+Date.now()+Math.random().toString(36).slice(2,6);S.entries.push(e);render();return}
 const ref=DB.collection('entries').doc();await ref.set(e)}
async function voidEntry(id,reason){const e=S.entries.find(x=>x.id===id);if(!e)return;
 if(MEM){e.voided=true;e.voidReason=reason;render();return}
 await DB.doc('entries/'+id).update({voided:true,voidReason:reason,voidedAt:new Date().toISOString()})}
async function savePlayer(p){if(MEM){p.id='p'+Date.now();S.players.push(p);render();return p.id}const ref=DB.collection('players').doc();await ref.set(p);return ref.id}
async function saveMidoriDay(d,v){if(MEM){S.midori[d]=v;render();return}await DB.doc('midori/'+d).set(v)}

 return `<div class="card"><div class="row" style="padding-top:0"><b>${p.l}</b><span class="big num ${tot<0?'neg':''}">${peso(tot)}</span></div>
 ${parts.length<2?'':parts.map(([m,v])=>`<div class="row"><span><span class="pill ${m}">${MED[m]}</span></span><span class="num ${v<0?'neg':''}">${peso(v)}</span></div>`).join('')}</div>`}
function vOverview(){
 const b=balances(),st=settings(),rc=receivables();
 const pb=S.players.map(p=>pBal(p.id,b));const dep=pb.filter(v=>v>0).reduce((s,v)=>s+v,0),loan=-pb.filter(v=>v<0).reduce((s,v)=>s+v,0);
 const m=S.month||monthOf(bizDay());const pl=monthPL(m);

 return `${!S.settings?`<div class="note warn">Starting balances are not set yet, so everything starts from 0. Enter them in Settings.</div>`:''}
 ${negs.length?`<div class="note bad">Below zero in the books: ${negs.join(', ')}. Usually money in was not recorded, or it went to the wrong pouch.</div>`:''}

 <h2>Owed and waiting</h2><div class="grid g3">
 ${card('Others owe us',Object.values(b.ar).reduce((s,v)=>s+v,0),'Receivables not collected',Object.entries(b.ar).filter(([,v])=>Math.abs(v)>0.001).map(([n,v])=>`<div class="row"><span class="sub">${esc(n)}</span><span class="num">${peso(v)}</span></div>`).join(''))}
 ${card('We owe',Object.values(b.ap).reduce((s,v)=>s+v,0),'Payables not paid',Object.entries(b.ap).filter(([,v])=>Math.abs(v)>0.001).map(([n,v])=>`<div class="row"><span class="sub">${esc(n)}</span><span class="num">${peso(v)}</span></div>`).join(''))}
 ${card('Player deposits',dep,`We owe ${pb.filter(v=>v>0).length} player(s)`)}
 ${card('Player credit',loan,`${pb.filter(v=>v<0).length} player(s) owe us`)}
 ${card('MIDORI owes us',rc.rake+rc.bbj,'',`<div class="row"><span class="sub">Rake (formula)</span><span class="num">${peso(rc.rake)}</span></div><div class="row"><span class="sub">BBJ 21%</span><span class="num">${peso(rc.bbj)}</span></div>`)}

 ${card('Mass chips to redeem',b.mass_chips||0,'Casino chips not changed with MIDORI yet')}

 ${card('Foreign cash held',FX_CUR.reduce((s,c)=>s+((b.fx||{})[c]||{php:0}).php,0),'Company advance at locked rates: '+fxLine(b.fx||{}))}
 ${card('Staff tips held',b.tipsheld||0,`Cash in the tip envelope: ${peso(b.tip_cash||0)}`,Object.entries(b.tipsBy||{}).filter(([,v])=>Math.abs(v)>0.001).map(([n,v])=>`<div class="row"><span class="sub">${esc(n)}</span><span class="num">${peso(v)}</span></div>`).join(''))}</div>
 <h2>Profit and loss · ${m} <select id="ov-month" style="width:auto;margin-left:8px">${allMonths().map(x=>`<option ${x===m?'selected':''}>${x}</option>`).join('')}</select></h2>
 <div class="grid g2"><div class="card"><table><tr><th>Income</th><th class="r">Amount</th></tr>${pl.inc.map(([c,v])=>`<tr><td>${esc(c)}</td><td class="r num">${peso(v)}</td></tr>`).join('')}
 <tr><td><b>Total income</b></td><td class="r num"><b>${peso(pl.incT)}</b></td></tr></table></div>
 <div class="card"><table><tr><th>Expenses</th><th class="r">Amount</th></tr>${pl.exp.map(([c,v])=>`<tr><td>${esc(c)}</td><td class="r num">${peso(v)}</td></tr>`).join('')||'<tr><td colspan="2" class="sub">No expenses yet</td></tr>'}
 <tr><td><b>Total expenses</b></td><td class="r num"><b>${peso(pl.expT)}</b></td></tr></table></div></div>
 <div class="card" style="margin-top:12px"><div class="row" style="padding:0"><b>Profit for ${m}</b><span class="big num ${pl.incT-pl.expT<0?'neg':'pos'}">${peso(pl.incT-pl.expT)}</span></div>
 <div class="sub">Rake and BBJ come from MIDORI's daily numbers and the formula. Playing behind is not in the profit until it is settled (this month ${sgn(pl.behind)}).</div></div>`}
function monthPL(m){
 const x=midoriMonth(m),inc={},exp={};let behind=0;
 inc['Rake (70% − rent − PAGCOR minimum top-up)']=x.rakeNet;inc['BBJ 21%']=x.bbj21;
 for(const e of liveEntries()){if(monthOf(e.date)!==m)continue;
  if(e.pl){if(e.pl.v>=0)inc[e.pl.cat]=(inc[e.pl.cat]||0)+e.pl.v;else exp[e.pl.cat]=(exp[e.pl.cat]||0)-e.pl.v}
  if(e.type==='behind')behind+=e.legs.find(g=>g.a==='behind').v}
 {const il=insLive();if(il)for(const [d,x] of Object.entries(il.days)){if(monthOf(d)!==m||d<INS_LINK)continue;if(x.net>=0)inc['Insurance win/loss']=(inc['Insurance win/loss']||0)+x.net;else exp['Insurance win/loss']=(exp['Insurance win/loss']||0)-x.net}}
 const mp=S.manpower[m];if(mp)for(const [k,l] of MP_FIELDS)if(Number(mp[k]||0))exp['Manpower · '+l]=Number(mp[k]);
 const sum=o=>Object.values(o).reduce((s,v)=>s+v,0);
 return{inc:Object.entries(inc),exp:Object.entries(exp).sort((a,b)=>b[1]-a[1]),incT:sum(inc),expT:sum(exp),behind}}

/* entry form */
function seg(name,opts,val){return `<div class="seg" data-field="${name}">${opts.map(([v,l])=>`<button type="button" class="${val===v?'on':''}" data-v="${v}">${l}</button>`).join('')}</div>`}
function pouchMedium(f,label='Which pouch'){
 const p=POUCHES.find(x=>x.k===f.pouch);if(p&&p.media.length===1)f.medium=p.media[0];
 return `<label>${label}</label>${seg('pouch',POUCHES.map(x=>[x.k,x.l]),f.pouch)}
 ${p&&p.media.length>1?`<label>Cash or chips?</label>${seg('medium',p.media.map(m=>[m,MED[m]]),f.medium)}`:''}`}
function vEntry(){

 const cats=list=>`<label>Category</label><select data-in="cat"><option value="">Choose…</option>${list.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>`;
 if(t==='expense')fields=`${cats(EXP_CATS)}${pouchMedium(f,'Paid from')}${amt}`;
 if(t==='income')fields=`${cats(INC_CATS)}${pouchMedium(f,'Put into')}${amt}`;
 if(t==='midori_pay'){const months=allMonths();fields=`<label>Month being settled</label><select data-in="forMonth"><option value="">Choose…</option>${months.map(m=>`<option ${f.forMonth===m?'selected':''}>${m}</option>`).join('')}</select>
  ${f.forMonth?(()=>{const x=midoriMonth(f.forMonth);return `<div class="sub" style="margin-top:4px">Expected: rake ${peso(x.dueRake)} · BBJ 21% ${peso(x.dueBbj)}</div>`})():''}
  ${pouchMedium(f,'Put into')}${amt}<div class="form2"><div><label>Rake part</label><input data-in="rakePart" inputmode="decimal" value="${esc(f.rakePart||'')}"></div><div><label>BBJ part</label><input data-in="bbjPart" inputmode="decimal" value="${esc(f.bbjPart||'')}"></div></div>`}
 if(t==='buyback'){if(!f.pouch){f.pouch='cf';f.medium='cash'}fields=`${pouchMedium(f,'Pay with cash from')}${amt}<div class="sub" style="margin-top:6px">BBJ / Rake not settled: ${peso(balances().box)}</div>`}
 if(t==='ar_in'||t==='ap_out'){const k=t==='ar_in'?'ar':'ap',bl=balances()[k],names=Object.entries(bl).filter(([,v])=>v>0.001);fields=`<label>${t==='ar_in'?'Who paid':'Paid to'}</label>${names.length?seg('who',names.map(([n,v])=>[n,`${n} · ${peso(v)}`]),f.who):'<div class="sub">Nothing open.</div>'}${pouchMedium(f,t==='ar_in'?'Put into':'Paid from')}${amt}`}
 if(t==='owner')fields=`<label>Owner</label>${seg('who',settings().owners.map(o=>[o,o]),f.who)}<label>In or out</label>${seg('dir',[['in','Put in'],['out','Take out']],f.dir)}${pouchMedium(f)}${amt}`;
 return `<h2>Shortcuts</h2>${vQuickBar()}<h2>Other entries</h2><div class="types">${TYPES.map(x=>`<button class="${t===x.k?'on':''}" data-type="${x.k}">${x.l}<small>${x.d}</small></button>`).join('')}</div>
 <div class="card" style="margin-top:14px;max-width:720px"><div class="form2"><div><label>Business day</label><input type="date" data-in="date" value="${esc(f.date)}"></div><div><label>Note</label><input data-in="note" value="${esc(f.note||'')}" placeholder="Optional"></div></div>
 ${fields}<div class="err" id="f-err"></div>
 ${S.pending?`<div class="confirm"><b>Please check:</b> ${esc(S.pending.summary)}<div class="flex" style="margin-top:10px"><button class="primary" id="f-confirm">Confirm and save</button><button id="f-back">Go back</button></div></div>`:`<div style="margin-top:14px"><button class="primary" id="f-check">Next</button></div>`}</div>
 <h2>Last 8 entries</h2><div class="card">${ledgerTable(S.entries.slice().sort(byNewest).slice(0,8),false)}</div>`}
const byNewest=(a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt);
function legText(e){return (e.legs||[]).filter(g=>['cf','ins','chip','day','bb'].includes(g.a)).map(g=>`<span class="pill ${g.m}">${pouchName(g.a)} · ${MED[g.m]}</span> <span class="num ${g.v<0?'neg':''}">${sgn(g.v)}</span>`).join('<br>')||'<span class="sub">No pouch change</span>'}
function ledgerTable(list,withVoid=true){

const CNT_CASH=[['cf','Cash float'],['ins','Insurance'],['day','On-day cash'],['pd','Player deposits (held)']];
const CNT_CHIPS=[['chip','Chip float'],['ins','Insurance'],['mass','Mass chips']];
const LINE_LBL={cf_cash:'Cash float',pd_cash:'Player deposit cash (held)',ins_cash:'Insurance cash',day_cash:'On-day buy-in cash',ins_chips:'Insurance chips',mass_chips:'Mass chips (casino)',chip_chips:'Chip float chips'};
const pesoE=n=>(n<0?'-':'')+'P'+Math.abs(round2(n)).toLocaleString('en-US',{maximumFractionDigits:2});
const sgnE=n=>(n>0?'+':n<0?'-':'')+Math.abs(round2(n)).toLocaleString('en-US',{maximumFractionDigits:2});
function cntTotals(c){const t={};for(const [k] of CNT_CASH)t[k+'_cash']=CASH_D.reduce((s,d)=>s+d*(Number((c.cash[k]||{})[d])||0),0);
 for(const [k] of CNT_CHIPS)t[k+'_chips']=CHIP_D.reduce((s,d)=>s+chipVal(d)*(Number((c.chips[k]||{})[d])||0),0);return t}
function lastCount(){return S.counts.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0]}
function cageOpen(){const l=lastCount();if(!l&&S.settings)return {first:true};return l&&l.kind==='open'?l:null}
function bookNow(){const b=balances();const o={};for(const k of Object.keys(LINE_LBL))o[k]=b[k]||0;return o}
const EXCH=['count_adj','chip_short','transfer','buyin','cashout','ins_settle','swap_c2ch','swap_ch2c','ins_move','mass_redeem','mass_close','tips_out','day_close','close_day','tip_pay'];
function dayCash(day){const ins=[],outs=[];
 for(const e of liveEntries()){if(e.date!==day||EXCH.includes(e.type))continue;
  for(const g of e.legs||[]){if(!['cf','ins','day','bb'].includes(g.a)||g.m!=='cash')continue;(g.v>0?ins:outs).push({s:e.summary,p:g.a,v:Math.abs(g.v),t:e.time})}}
 return{ins,outs}}

const staffList=()=>settings().staff||[];
async function hashPin(name,pin){const txt='everest|'+lname(name)+'|'+pin;try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const ch of txt)h=(h*31+ch.charCodeAt(0))|0;return 'x'+h}}
try{const u=JSON.parse(sessionStorage.getItem('everest-user')||'null');if(u)S.user=u}catch(e){}

/* flows */
function startFlow(kind){S.flow={kind,step:S.user?(kind==='open'?'count':'players'):'signin',d:{players:false,insCount:'',insReason:'',tipPool:'',dealers:(tipPeople()[dealerRole()]||[]).map(n=>({n,a:''})),personal:[],mass:'',pb:{},supervisor:''}};S.cnt=null;S.qa=null;
 if(S.user&&kind==='open')toCount('open')}
function toCount(kind){S.cnt={kind,step:'count',cashier:S.user?S.user.name:'',supervisor:S.flow?S.flow.d.supervisor:'',cash:{cf:{},ins:{},day:{},bb:{},pd:{}},chips:{chip:{},ins:{},mass:{}},reasons:{},midori:{rake:{},bbj:{}},midoriSkip:false,fx:{same:true,TWD:'',USD:''}};if(S.flow)S.flow.step='count'}
function fxMovedToday(){const l=lastCount(),since=l?String(l.at):'';return liveEntries().filter(e=>(e.type==='fx_in'||e.type==='fx_out')&&String(e.createdAt)>since)}
function fxBook(){const f=balances().fx||{};return Object.fromEntries(FX_CUR.map(c=>[c,f[c]||{amt:0,php:0}]))}

 if(S.flow){if(S.flow.step==='signin')return flowHead()+vSignIn();if(S.cnt&&S.cnt.step==='count')return flowHead()+vCountForm();if(S.cnt&&S.cnt.step==='result')return flowHead()+vCountResult();return flowHead()+vCloseStep()}
 return vCountHome()}
const CLOSE_STEPS=[['players','Players cashed out'],['ins','Insurance chips'],['tips','Tips'],['mass','Mass chips'],['pb','Playing behind'],['net','On-day net income'],['count','Count everything'],['result','Check and print']];
const OPEN_STEPS=[['count','Count chips, cash and insurance'],['result','MIDORI numbers, check and print']];
function flowHead(){const f=S.flow,steps=f.kind==='open'?OPEN_STEPS:CLOSE_STEPS;const cur=S.cnt?S.cnt.step:f.step;const ix=steps.findIndex(s=>s[0]===cur);
 return `<div class="flex" style="margin-bottom:8px"><b style="font-size:17px">${f.kind==='open'?'Open':'Close'} the cage · business day ${bizDay()}</b>${S.user?`<span class="sub">Signed in: ${esc(S.user.name)}</span>`:''}</div>
 <div class="flex" style="margin-bottom:14px;gap:6px">${steps.map((s,i)=>`<span class="pill ${i<ix?'cash':i===ix?'info':''}" style="${i>ix?'border:1px solid var(--line)':''}">${i+1}. ${s[1]}</span>`).join('')}</div>`}
function pbToday(day){const by={};for(const e of liveEntries()){if(e.date!==day||e.type!=='behind')continue;const w=e.who||'?';const v=(e.legs.find(g=>g.a==='behind')||{}).v||0;by[w]=by[w]||{out:0,back:0};if(v<0)by[w].out+=-v;else by[w].back+=v}
 return Object.entries(by).map(([who,x])=>({who,...x,net:round2(x.back-x.out)}))}
function tipPeople(){const t=settings().tipPeople;return t&&typeof t==='object'?t:{'Dealers':['Wilmer','Mhaiy','Lhen'],'MGM':['Owner'],'Consultant':['Geraldine'],'Floor':['Floor supervisor'],'Supervisor':['Phoebe'],'Admin / cashier':['Mary Anne'],'Service':['Shout','Regene','Oliver'],'Employee incentive':['Incentive fund']}}
function dealerRole(){const r=tipSplit().find(([n])=>/dealer/i.test(n));return r?r[0]:null}
function tipAlloc(dealers,personal){const out={};const tp=tipPeople(),dr=dealerRole();const rows=(dealers||[]).filter(r=>r.n.trim()&&num(r.a)>0);const pool=round2(rows.reduce((s,r)=>s+num(r.a),0));
 for(const [role,pc] of tipSplit()){if(role===dr){for(const r of rows){const n=r.n.trim();out[n]=round2((out[n]||0)+round2(num(r.a)*pc/100))}continue}const amt=round2(pool*pc/100);const names=(tp[role]&&tp[role].length)?tp[role]:[role];const each=Math.floor(amt/names.length*100)/100;names.forEach((n,i)=>{const v=i===names.length-1?round2(amt-each*(names.length-1)):each;out[n]=round2((out[n]||0)+v)})}
 for(const r of personal){const n=r.n.trim();if(n&&num(r.a)>0)out[n]=round2((out[n]||0)+num(r.a))}return out}
function closeNumbers(){const d=S.flow.d,b=balances(),day=bizDay();const insBook=b.ins_chips||0,insCnt=d.insCount===''?insBook:num(d.insCount);
 const pb=pbToday(day);const settled=pb.filter(p=>p.net>=0||(d.pb[p.who]||{}).st==='lost');const uns=pb.filter(p=>p.net<0&&(d.pb[p.who]||{}).st!=='lost');
 const pbRes=round2(settled.reduce((s,p)=>s+p.net,0));const dl=d.dealers||[];const pool=round2(dl.filter(r=>num(r.a)>0).reduce((s,r)=>s+num(r.a),0));const alloc=tipAlloc(dl,d.personal);const tipT=round2(Object.values(alloc).reduce((s,v)=>s+v,0));
 const mass=d.mass===''?(b.mass_chips||0):num(d.mass);
 return{insBook,insCnt,pb,settled,uns,pbRes,pool,alloc,tipT,mass,net:round2(insCnt+pbRes)}}
function allocTable(X){const al=Object.entries(X.alloc).filter(([,v])=>v);return al.length?`<table style="margin-top:8px"><tr><th>Goes to tip reserve of</th><th class="r">₱</th></tr>${al.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="r num">${v.toLocaleString('en-US')}</td></tr>`).join('')}<tr><td><b>Total cashed out from chips</b></td><td class="r num"><b>${X.tipT.toLocaleString('en-US')}</b></td></tr></table>`:''}
function vCloseStep(){const f=S.flow,d=f.d,b=balances(),day=bizDay();const nav=(back,next,label='Next')=>`<div class="err" id="cs-err"></div><div class="flex" style="margin-top:12px">${back?`<button data-cs="${back}">Back</button>`:''}<button class="primary" data-cs="${next}">${label}</button><button class="link" id="flow-cancel">Cancel</button></div>`;

 if(f.step==='players'){const list=liveEntries().filter(e=>e.date===day&&(e.type==='buyin'||e.type==='cashout'));const by={};for(const e of list){const n=playerName(e.player);by[n]=by[n]||{in:0,out:0};by[n][e.type==='buyin'?'in':'out']+=e.amount}
  const first=!S.counts.length,o=settings().open;
  return (first?`<div class="hl"><b class="t">⚠ First close: check the starting numbers</b>These came from Settings. If any is wrong, press Cancel and fix Settings first.<table style="margin-top:6px">${[['Cash float',o.cf_cash],['Chip float (tray)',o.chip_chips],['Insurance cash',o.ins_cash],['Insurance chips',o.ins_chips],['On-day buy-in cash',o.day_cash],['Chips given to players today',o.chipsOut],['Mass chips',o.mass_chips],['Foreign cash TWD',o.fx_TWD,'TWD'],['Foreign cash USD',o.fx_USD,'USD']].map(([l,v,c])=>`<tr><td>${l}</td><td class="r num">${c?c+' '+Number(v||0).toLocaleString('en-US'):pesoE(Number(v||0))}</td></tr>`).join('')}</table></div>`:'')+card(`<b>Step 1 · Make sure every player has cashed out and returned their chips</b><table style="margin-top:8px"><tr><th>Player</th><th class="r">Bought in</th><th class="r">Cashed out</th></tr>${Object.entries(by).map(([n,x])=>`<tr><td>${esc(n)}</td><td class="r num">${x.in.toLocaleString('en-US')}</td><td class="r num">${x.out.toLocaleString('en-US')}</td></tr>`).join('')||'<tr><td colspan="3" class="sub">No buy-ins recorded today</td></tr>'}</table>
  <label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:12px"><input type="checkbox" id="cs-players" style="width:auto" ${d.players?'checked':''}> All players have cashed out or returned their chips. All tables are empty.</label>${nav('','ins')}`)}
 if(f.step==='ins')return card(`<b>Step 2 · Count insurance chips and change them to cash</b>${(()=>{const il=insLive(),x=il&&il.days[bizDay()];return !il?'<div class="note bad" style="margin-top:6px">Insurance tickets are not loaded yet. Wait a moment before going on.</div>':x&&x.pending?`<div class="note warn" style="margin-top:6px">⚠ ${x.pending} insurance ticket(s) are not settled (${pesoE(x.pending_amount)}). Ask the supervisor to settle them on the Insurance page first. 還有未結算保單。</div>`:''})()}<div class="sub" style="margin-top:4px">From the Insurance page: settled tickets of the day, kept as chips until now.</div><div class="row"><span>Insurance chips in the books</span><b class="num">${pesoE(X.insBook)}</b></div>
  <label>Insurance chips counted (₱)</label><input id="cs-ins" inputmode="decimal" value="${esc(d.insCount===''?X.insBook:d.insCount)}" style="max-width:220px">
  ${Math.abs(X.insCnt-X.insBook)>0.001?`<label>Why is it different?</label><input id="cs-insr" value="${esc(d.insReason)}">`:''}
  <div class="hl"><b class="t">Do this now</b><ol><li>Put the insurance chips into the <b>chip float</b> tray.</li><li>Take the same amount of cash from <b>on-day cash</b> and put it into the <b>cash float</b>.</li></ol>After this, insurance chips should be 0.</div>${nav('players','tips')}`);
 if(f.step==='tips'){const al=Object.entries(X.alloc);return card(`<b>Step 3 · Count tip chips and give each person their share</b>
  <label>Each dealer's tips today (₱)</label><div class="sub">The dealer keeps ${(tipSplit().find(([n])=>n===dealerRole())||[0,0])[1]}% of their own tips. Other dealers do not share it. The rest goes to the other roles by the split.</div>
  ${(d.dealers||[]).map((r,i)=>`<div class="flex" style="margin:6px 0"><input data-dt="${i}|n" value="${esc(r.n)}" placeholder="Dealer" style="max-width:200px"><input data-dt="${i}|a" inputmode="decimal" value="${esc(r.a)}" placeholder="₱" style="max-width:140px"><button class="link" data-dtdel="${i}">Remove</button></div>`).join('')}<button class="link" id="cw-adddt">+ Add dealer</button>
  <div class="row" style="max-width:360px"><span>Total tips</span><b class="num" id="tip-pool">${pesoE(X.pool)}</b></div>
  <label>Personal tips kept in full (service and cage)</label>${d.personal.map((r,i)=>`<div class="flex" style="margin-bottom:6px"><input data-pt="${i}|n" value="${esc(r.n)}" placeholder="Name" style="max-width:200px"><input data-pt="${i}|a" inputmode="decimal" value="${esc(r.a)}" placeholder="₱" style="max-width:140px"><button class="link" data-ptdel="${i}">Remove</button></div>`).join('')}<button class="link" id="cw-addpt">+ Add personal tip</button>
  <div id="tip-alloc">${allocTable(X)}</div>

function breakEvenRake(){const st=settings();const r1=(st.rent+st.pagcorMin)/(st.everestRakeRate+st.pagcorRate);if(r1*st.pagcorRate<st.pagcorMin)return r1;return st.rent/st.everestRakeRate}
function vMidoriGap(m){const st=settings(),x=midoriMonth(m);const pag=Math.max(st.pagcorMin,x.R*st.pagcorRate);const be=breakEvenRake();
 const [Y,M]=m.split('-').map(Number);const dim=new Date(Y,M,0).getDate();const today=bizDay();const daysDone=monthOf(today)===m?Number(today.slice(8,10)):(m<monthOf(today)?dim:0);const left=Math.max(0,dim-daysDone);
 const need=Math.max(0,be-x.R);
 return `<div class="grid g2"><div class="card"><b>${m} · what MIDORI takes</b>
 <div class="row"><span>Rake so far</span><b class="num">${peso(x.R)}</b></div>
 <div class="row"><span>Rent (base)</span><span class="num">${peso(st.rent)}</span></div>
 <div class="row"><span>PAGCOR · 25% or minimum ${peso(st.pagcorMin)}</span><span class="num">${peso(pag)}</span></div>
 <div class="row"><span class="sub">of which 25% of rake ${peso(x.pag)} · we top up ${peso(x.short)}</span><span></span></div>
 <div class="row"><span>CDC 5%</span><span class="num">${peso(x.cdc)}</span></div>
 <div class="row"><span>Everest 70% of rake</span><span class="num">${peso(x.R*st.everestRakeRate)}</span></div>
 <div class="row"><b>Everest after rent and PAGCOR minimum</b><b class="num ${x.rakeNet<0?'neg':'pos'}">${peso(x.rakeNet)}</b></div></div>
 <div class="card"><b>How far from break-even</b>
 ${x.rakeNet<0?`<div class="big num neg" style="margin:6px 0">Short ${peso(-x.rakeNet)}</div>`:`<div class="big num pos" style="margin:6px 0">Ahead ${peso(x.rakeNet)}</div>`}
 <div class="row"><span>Break-even rake for the month</span><span class="num">${peso(be)}</span></div>
 <div class="row"><span>Rake still needed</span><b class="num">${peso(need)}</b></div>
 <div class="row"><span>Days left this month</span><span class="num">${left}</span></div>
 <div class="row"><span>Needed per day</span><b class="num">${left?peso(need/left):'-'}</b></div>
 <div class="row"><span class="sub">Average so far per day</span><span class="num">${daysDone?peso(x.R/daysDone):'-'}</span></div>
 <div class="row"><span>BBJ 21% (separate)</span><span class="num">${peso(x.bbj21)}</span></div></div></div>`}

 if(q('st-import'))q('st-import').onchange=async()=>{const f=q('st-import').files[0];if(!f)return;const m=q('st-impmsg');try{const j=JSON.parse(await f.text());const docs=j.docs||[];let n=0,skip=0;

function errMsg(e){const c=e&&e.code;if(c==='quota_exceeded')return 'Storage is full.';if(c==='invalid_argument')return 'Not allowed to save, or the data is not valid.';if(c==='unavailable')return 'Cannot connect right now. Try again.';return (e&&e.message)||'Save failed'}
let flashT;function flash(t){const s=$('status');s.textContent=t;clearTimeout(flashT);flashT=setTimeout(()=>setStatus(),2500)}
function setStatus(){$('status').textContent=MEM?'⚠ Not connected. Data stays in this tab only.':(Object.values(S.loaded).every(Boolean)?'Connected · saved automatically':'Loading…')}

const canRender=()=>!S.pending&&!(S.cnt&&['count','result'].includes(S.cnt.step))&&!(S.qa&&!(S.qa.isDefault&&!S.qa.player&&!S.qa.amount&&!S.qaMsg))&&!S.cw;
/* ---------- init: Everest API ---------- */
const API=(window.EVEREST_API_URL||'https://everest-waiting-api.drumsjw47.workers.dev').replace(/\/$/,'');
let TOKEN=sessionStorage.getItem('cage-token')||'';
async function api(path,method='GET',body){const res=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},...(body?{body:JSON.stringify(body)}:{})});
 const d=await res.json().catch(()=>({}));if(res.status===401){TOKEN='';sessionStorage.removeItem('cage-token');showLogin();const e=new Error('Please sign in again.');throw e}
 if(!res.ok){const e=new Error(d.error||('Error '+res.status));e.status=res.status;throw e}return d}
function makeDb(){const store={},subs=[];let rev=0,busy=false;
 const newId=()=>Array.from(crypto.getRandomValues(new Uint8Array(15)),b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('');
 const snapColl=c=>({docs:Object.entries(store[c]||{}).map(([id,d])=>({id,data:()=>d.data})),metadata:{fromCache:false}});
 const emit=()=>subs.forEach(s=>{try{s()}catch(e){console.error(e)}});
 async function pull(force){if(busy)return;busy=true;try{let more=true,changed=!!force||!rev;while(more){const r=await api('/cage?since='+rev);if(r.docs.length)changed=true;for(const d of r.docs){store[d.coll]=store[d.coll]||{};if(d.deleted)delete store[d.coll][d.id];else store[d.coll][d.id]={data:d.data,version:d.version}}rev=r.rev;more=r.more}if(changed){emit();if(canRender())render()}}finally{busy=false}}
 async function write(coll,id,op,data){await api('/cage/doc','POST',{coll,id,op,data});busy=false;await pull(true)}
 const ref=(coll,id)=>({id,set:d=>write(coll,id,'set',JSON.parse(JSON.stringify(d))),update:d=>write(coll,id,'update',JSON.parse(JSON.stringify(d))),delete:()=>write(coll,id,'delete'),
  onSnapshot:(cb,err)=>{subs.push(()=>{const d=(store[coll]||{})[id];cb({exists:!!d,data:()=>d?d.data:undefined,metadata:{fromCache:false}})})}});
 return{pull,collection:c=>({doc:id=>ref(c,id||newId()),onSnapshot:(cb,err)=>{subs.push(()=>cb(snapColl(c)))}}),doc:p=>{const [c,id]=p.split('/');return ref(c,id)}}}
function showLogin(){$('login').style.display='';$('app').style.display='none';$('nav').style.display='none';$('logout').style.display='none';$('who').textContent=''}
$('lf').onsubmit=async e=>{e.preventDefault();$('lerr').textContent='';try{const res=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('un').value.trim(),password:$('pw').value})});const d=await res.json();if(!res.ok)throw new Error(d.error||'Sign-in failed');
 TOKEN=d.token;sessionStorage.setItem('cage-token',TOKEN);$('pw').value='';start()}catch(err){$('lerr').textContent=err.message}};
$('logout').onclick=async()=>{try{await api('/logout','POST',{})}catch(e){}TOKEN='';sessionStorage.removeItem('cage-token');setUser(null);showLogin()};
let started=false;
async function start(){if(!TOKEN){showLogin();return}
 $('login').style.display='none';$('app').style.display='';$('nav').style.display='';$('logout').style.display='';
 let me;try{me=await api('/me')}catch(e){return}
 $('who').textContent=me.user||'';S.role=me.role;if(!S.user||S.user.name!==me.user)setUser({name:me.user,role:me.role});
 if(started)return;started=true;
 const db=makeDb();DB=db;const done=k=>{S.loaded[k]=true;setStatus()};
 db.collection('entries').onSnapshot(s=>{S.entries=s.docs.map(d=>({id:d.id,...d.data()}));done('e');});
 db.collection('players').onSnapshot(s=>{S.players=s.docs.map(d=>({id:d.id,...d.data()}));done('p');});
 db.collection('midori').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.midori=m;done('m')});
 db.collection('ppm').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.ppm=m});
 db.collection('manpower').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.manpower=m});
 db.collection('counts').onSnapshot(s=>{S.counts=s.docs.map(d=>({id:d.id,...d.data()}));done('c')});
 db.doc('config/settings').onSnapshot(s=>{S.settings=s.exists?s.data():null;done('s');});
 try{await db.pull()}catch(e){$('status').textContent='Loading failed: '+errMsg(e)}
 setInterval(()=>{if(!document.hidden)db.pull().catch(()=>{})},10000)}
render();setStatus();start();
