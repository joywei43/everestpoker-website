<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121212">
<title>Everest Poker Room · Members</title>
<link rel="icon" type="image/png" href="../members/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="../waiting-list/config.js"></script>
<style>
:root{--ink:#121212;--ink2:#1E1D1A;--gold:#D1A647;--gold-l:#F3E7C8;--bg:#F2F1EE;--card:#fff;--line:#E3E0DA;--text:#1B1A17;--muted:#5F5B53;--green:#1E6B43;--green-l:#DFF3E7;--amber:#6B4A00;--amber-l:#FFF1D1;--red:#B42318;--red-l:#FDECEA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 'IBM Plex Sans','Noto Sans TC','Noto Sans JP','Noto Sans KR',system-ui,sans-serif}
:lang(ja) body,body:lang(ja){font-family:'IBM Plex Sans','Noto Sans JP',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header img{height:34px;width:auto}
.lang{background:var(--ink2);color:#fff;border:1px solid #3A362E;border-radius:8px;height:36px;padding:0 8px}
main{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.card{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--line)}
h2{margin:0;font-size:15px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.btn{height:46px;border-radius:12px;border:1px solid #CFCAC0;background:#fff;padding:0 16px;font-weight:600;cursor:pointer}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1406}
.btn.sm{height:38px;font-size:14px}
.btn[disabled]{opacity:.55}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
input,select.in{height:48px;border:1px solid #CFCAC0;border-radius:12px;padding:0 12px;background:#fff;width:100%}
.mono{font-family:'IBM Plex Mono',monospace}
.muted{color:var(--muted)}.small{font-size:13px}
.chip{border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.open{background:var(--green-l);color:var(--green)}.chip.full{background:var(--amber-l);color:var(--amber)}
.msg{border-radius:12px;padding:10px 12px;font-size:14px}.msg.err{background:var(--red-l);color:var(--red)}.msg.ok{background:var(--green-l);color:var(--green)}
.memcard{background:var(--ink);color:#fff;border-radius:18px;padding:18px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.memcard svg.bgm{position:absolute;right:-24px;bottom:-14px;opacity:.5}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar{overflow:hidden;width:72px;height:72px;border-radius:50%;background:var(--gold-l);color:#5E410C;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex:none;position:relative}
.seats{display:flex;gap:5px}.seats i{width:16px;height:16px;border-radius:50%;border:2px solid #9A9488;display:block}.seats i.on{background:var(--ink);border-color:var(--ink)}
.list>div{padding:11px 0;border-top:1px solid #EFECE6}.list>div:first-child{border-top:0}
.waitcard{border:2px solid var(--gold)}
.big{font-size:30px;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats div{background:#F6F4F0;border-radius:12px;padding:10px 12px}
footer{padding:18px 16px 28px;text-align:center;font-size:12px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="../members/logo.png" alt="Everest Poker Room">
    <div class="row"><label class="sr" for="lang">Language</label><select id="lang" class="lang"><option value="en">English</option><option value="zh">繁中</option><option value="ja">日本語</option><option value="ko">한국어</option></select>
    <button class="lang" id="logout" hidden></button></div></header>
  <main id="main" aria-live="polite"></main>
  <footer id="foot"></footer>
</div>
<script>
(() => {
'use strict';
const API = (window.EVEREST_API_URL || 'https://everest-waiting-api.drumsjw47.workers.dev').replace(/\/$/, '');
const KEY = 'everest-member-token', LANG_KEY = 'everest-member-lang';
const T = {
  en: { login: 'Member sign in', memberNo: 'Member number', birthday: 'Date of birth', signIn: 'Sign in', signOut: 'Sign out', wrong: 'Member number or birthday is not correct.', inactive: 'Your membership is on hold. Please ask the staff.', tooMany: 'Too many tries. Please wait 15 minutes.', noBirthday: 'No member number yet? Please ask at the counter and show your ID.', register: 'Register', error: 'Something went wrong. Please try again.',
    memberNo2: 'Member no.', myWait: 'My waitlist', place: 'Your place', called: 'You are being called — please go to the counter!', ahead: (n) => n === 1 ? 'You are next' : `${n - 1} ahead of you`, leave: 'Leave waitlist', join: 'Join waitlist', chooseGame: 'Game', already: 'You are already on a waitlist.', joined: 'You are on the waitlist.',
    tables: 'Tables now', updated: 'Updated', open: (n) => `${n} seat${n === 1 ? '' : 's'} open`, full: 'Full', waiting: (n) => `${n} waiting`, players: (n) => `${n} / 9 players`, noTables: 'No tables open right now.', legend: 'Filled = seat taken',
    records: 'My game record', days30: 'Visit days · 30 days', hours30: 'Play time · 30 days', noRecords: 'No games yet.', restNote: 'Play time from the table system, breaks not counted.',
    promos: 'Promotions', noPromos: 'Ask the staff about current promotions.', foot: '21 years old and above only. Gambling can be addictive. Know when to stop.', h: 'h', m: 'm', days: 'days' },
  zh: { login: '會員登入', memberNo: '會員號碼', birthday: '出生日期', signIn: '登入', signOut: '登出', wrong: '會員號碼或生日不正確。', inactive: '您的會員資格暫停中，請洽現場人員。', tooMany: '嘗試次數過多，請 15 分鐘後再試。', noBirthday: '還沒有會員號碼？請到櫃台出示證件辦理。', register: '註冊', error: '發生錯誤，請再試一次。',
    memberNo2: '會員號碼', myWait: '我的候位', place: '目前順位', called: '輪到您了，請到櫃台！', ahead: (n) => n === 1 ? '下一位就是您' : `前面還有 ${n - 1} 位`, leave: '取消候位', join: '登記候位', chooseGame: '遊戲', already: '您已經在候位中。', joined: '已登記候位。',
    tables: '現在桌況', updated: '更新', open: (n) => `${n} 個空位`, full: '滿桌', waiting: (n) => `候位 ${n} 人`, players: (n) => `${n} / 9 人`, noTables: '目前沒有開桌。', legend: '實心 = 有人入座',
    records: '我的遊戲紀錄', days30: '近 30 天來訪', hours30: '近 30 天遊戲時數', noRecords: '還沒有遊戲紀錄。', restNote: '遊戲時數依桌邊系統紀錄，不含休息時間。',
    promos: '目前活動', noPromos: '目前活動請洽現場人員。', foot: '僅限 21 歲以上。博弈可能使人上癮，請適可而止。', h: '小時', m: '分', days: '天' },
  ja: { login: '会員ログイン', memberNo: '会員番号', birthday: '生年月日', signIn: 'ログイン', signOut: 'ログアウト', wrong: '会員番号または生年月日が正しくありません。', inactive: '会員資格が停止中です。スタッフにお問い合わせください。', tooMany: '試行回数が多すぎます。15分後にお試しください。', noBirthday: '会員番号がない方は、受付で身分証をご提示ください。', register: '登録', error: 'エラーが発生しました。もう一度お試しください。',
    memberNo2: '会員番号', myWait: 'ウェイティング', place: '現在の順番', called: '順番です。受付へお越しください！', ahead: (n) => n === 1 ? '次の番です' : `前に ${n - 1} 人`, leave: '取り消す', join: 'ウェイティング登録', chooseGame: 'ゲーム', already: 'すでにウェイティング中です。', joined: '登録しました。',
    tables: '現在のテーブル', updated: '更新', open: (n) => `空席 ${n}`, full: '満席', waiting: (n) => `待ち ${n} 人`, players: (n) => `${n} / 9 人`, noTables: '現在営業中のテーブルはありません。', legend: '塗りつぶし = 着席中',
    records: 'プレイ履歴', days30: '30日間の来店日数', hours30: '30日間のプレイ時間', noRecords: 'まだ履歴がありません。', restNote: 'プレイ時間はテーブルシステムの記録です（休憩を除く）。',
    promos: '開催中のプロモーション', noPromos: 'プロモーションはスタッフにお尋ねください。', foot: '21歳以上の方のみ。ギャンブルは依存症になることがあります。', h: '時間', m: '分', days: '日' },
  ko: { login: '회원 로그인', memberNo: '회원 번호', birthday: '생년월일', signIn: '로그인', signOut: '로그아웃', wrong: '회원 번호 또는 생년월일이 올바르지 않습니다.', inactive: '회원 자격이 정지되었습니다. 직원에게 문의해주세요.', tooMany: '시도 횟수가 너무 많습니다. 15분 후 다시 시도해주세요.', noBirthday: '회원 번호가 없으신가요? 카운터에서 신분증을 보여주세요.', register: '등록', error: '오류가 발생했습니다. 다시 시도해주세요.',
    memberNo2: '회원 번호', myWait: '내 대기', place: '현재 순서', called: '차례입니다. 카운터로 와주세요!', ahead: (n) => n === 1 ? '다음 차례입니다' : `앞에 ${n - 1}명`, leave: '대기 취소', join: '대기 등록', chooseGame: '게임', already: '이미 대기 중입니다.', joined: '대기 등록되었습니다.',
    tables: '현재 테이블', updated: '업데이트', open: (n) => `빈자리 ${n}`, full: '만석', waiting: (n) => `대기 ${n}명`, players: (n) => `${n} / 9명`, noTables: '현재 열린 테이블이 없습니다.', legend: '채워진 원 = 착석',
    records: '내 게임 기록', days30: '30일 방문 일수', hours30: '30일 플레이 시간', noRecords: '아직 기록이 없습니다.', restNote: '플레이 시간은 테이블 시스템 기록이며 휴식 시간은 제외됩니다.',
    promos: '진행 중인 프로모션', noPromos: '프로모션은 직원에게 문의해주세요.', foot: '만 21세 이상만 이용 가능합니다. 도박은 중독될 수 있습니다.', h: '시간', m: '분', days: '일' }
};
let lang = localStorage.getItem(LANG_KEY) || ({ zh: 'zh', ja: 'ja', ko: 'ko' }[(navigator.language || 'en').slice(0, 2)] || 'en');
let token = localStorage.getItem(KEY) || '';
let timer = null, flashMsg = null, photo = null;
const t = (k, ...a) => { const v = (T[lang] || T.en)[k] ?? T.en[k]; return typeof v === 'function' ? v(...a) : v; };
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dur = (s) => { s = Math.max(0, Math.round(s || 0)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return `${h} ${t('h')} ${String(m).padStart(2, '0')} ${t('m')}`; };
const dateLabel = (d) => { try { return new Intl.DateTimeFormat({ en: 'en-GB', zh: 'zh-TW', ja: 'ja-JP', ko: 'ko-KR' }[lang], { month: 'short', day: 'numeric', weekday: 'short', timeZone: 'UTC' }).format(new Date(d + 'T00:00:00Z')); } catch (e) { return d; } };
const clock = () => new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Manila' }).format(new Date());
const main = document.getElementById('main');
const langSel = document.getElementById('lang'), logoutBtn = document.getElementById('logout');

async function api(path, method = 'GET', body) {
  const res = await fetch(API + path, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, ...(body ? { body: JSON.stringify(body) } : {}) });
  let d = {}; try { d = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== '/member/login') { token = ''; localStorage.removeItem(KEY); }
  if (!res.ok) { const e = new Error(d.error || 'error'); e.status = res.status; throw e; }
  return d;
}

function chrome() {
  document.documentElement.lang = { zh: 'zh-Hant', ja: 'ja', ko: 'ko', en: 'en' }[lang];
  langSel.value = lang; logoutBtn.hidden = !token; logoutBtn.textContent = t('signOut');
  document.getElementById('foot').textContent = t('foot');
}

function renderLogin(err) {
  chrome(); clearInterval(timer);
  main.innerHTML = `<section class="card" style="display:flex;flex-direction:column;gap:14px;margin-top:10px">
    <h1 style="margin:0;font-size:22px">${t('login')}</h1>
    <form id="lf" style="display:flex;flex-direction:column;gap:12px">
      <label class="f">${t('memberNo')}<input id="no" class="mono" placeholder="EV-000123" autocomplete="username" autocapitalize="characters" required maxlength="30"></label>
      <label class="f">${t('birthday')}<input id="bd" type="date" autocomplete="bday" required></label>
      ${err ? `<div class="msg err" role="alert">${esc(err)}</div>` : ''}
      <button class="btn gold">${t('signIn')}</button>
    </form>
    <p class="small muted" style="margin:0">${t('noBirthday')}</p></section>`;
  document.getElementById('lf').onsubmit = async (e) => {
    e.preventDefault();
    try { const d = await api('/member/login', 'POST', { member_no: document.getElementById('no').value.trim(), birthday: document.getElementById('bd').value }); token = d.token; localStorage.setItem(KEY, token); renderHome(); }
    catch (err) { renderLogin(err.status === 401 ? t('wrong') : err.status === 403 ? t('inactive') : err.status === 429 ? t('tooMany') : t('error')); }
  };
}

async function renderHome() {
  chrome();
  let me, room;
  try { [me, room] = await Promise.all([api('/member/me'), api('/member/room')]); }
  catch (e) { return token ? main.innerHTML = `<div class="msg err">${t('error')}</div>` : renderLogin(); }
  const m = me.member, wait = me.waitlist[0];
  const initials = (m.nickname || m.name || '?').trim().slice(0, 2).toUpperCase();
  const openGames = [...new Set(room.tables.map((x) => `${x.blinds} ${x.game_type}`))];
  const games = [...openGames, ...room.games.filter((g) => !openGames.includes(g))];
  main.innerHTML = `
    <section class="memcard" aria-label="${t('memberNo2')}">
      <svg class="bgm" width="200" height="100" viewBox="0 0 220 110" aria-hidden="true"><path d="M0 110 L80 30 L115 70 L145 45 L220 110 Z" fill="#2A2720"/></svg>
      <div class="avatar" aria-hidden="true">${esc(initials)}</div>
      <div style="position:relative;min-width:0">
        <div style="font-size:21px;font-weight:700">${esc(m.nickname || m.name)}</div>
        ${m.nickname ? `<div class="small" style="color:#C9C2B4">${esc(m.name)}</div>` : ''}
        <div class="small" style="color:#C9C2B4;margin-top:6px">${t('memberNo2')}</div>
        <div class="mono" style="font-size:17px;letter-spacing:.05em;color:var(--gold)">${esc(m.member_no)}</div>
      </div>
    </section>
    ${flashMsg ? `<div class="msg ${flashMsg.kind}" role="status">${esc(flashMsg.text)}</div>` : ''}
    ${wait ? `<section class="card waitcard" style="display:flex;flex-direction:column;gap:10px">
      <div class="row between"><h2 style="color:#5E410C">${t('myWait')}</h2></div>
      <div class="row between" style="align-items:flex-end"><div><div style="font-size:20px;font-weight:700">${esc(wait.game)}</div>
        <div class="small muted">#${String(wait.num).padStart(3, '0')} · ${wait.called ? '' : t('ahead', wait.position)}</div></div>
        ${wait.called ? '' : `<div style="text-align:right"><div class="small muted">${t('place')}</div><div class="big">${wait.position}</div></div>`}</div>
      ${wait.called ? `<div class="msg ok" style="font-weight:600">${t('called')}</div>` : ''}
      <button class="btn sm" id="leave">${t('leave')}</button></section>` : ''}
    <section class="card"><div class="row between" style="margin-bottom:6px"><h2>${t('tables')}</h2><span class="small muted">${t('updated')} ${clock()}</span></div>
      <div class="list">${room.tables.map((x) => { const free = 9 - x.taken, w = room.waiting[`${x.blinds} ${x.game_type}`] || 0; return `<div>
        <div class="row between"><div class="row" style="gap:8px"><span class="chip" style="background:var(--ink);color:#fff;border-radius:6px">${esc(x.name)}</span><b>${esc(x.game_type)} ${esc(x.blinds)}</b></div>
          <span class="chip ${free ? 'open' : 'full'}">${free ? t('open', free) : t('full') + (w ? ' · ' + t('waiting', w) : '')}</span></div>
        <div class="row between" style="margin-top:8px"><div class="seats" role="img" aria-label="${t('players', x.taken)}">${x.seats.map((s) => `<i class="${s ? 'on' : ''}"></i>`).join('')}</div><span class="small muted">${t('players', x.taken)}</span></div></div>`; }).join('') || `<div class="muted">${t('noTables')}</div>`}</div>
      ${wait ? '' : `<form id="jf" class="row" style="margin-top:12px"><label class="sr" for="game">${t('chooseGame')}</label><select id="game" class="in" style="flex:1">${games.map((g) => `<option>${esc(g)}</option>`).join('')}</select><button class="btn gold">${t('join')}</button></form>`}
      <p class="small muted" style="margin:10px 0 0">${t('legend')}</p></section>
    <section class="card"><h2 style="margin-bottom:10px">${t('records')}</h2>
      <div class="stats"><div><div class="small muted">${t('days30')}</div><div style="font-size:22px;font-weight:700">${me.stats.last30.days} <span class="small">${t('days')}</span></div></div>
        <div><div class="small muted">${t('hours30')}</div><div style="font-size:18px;font-weight:700">${dur(me.stats.last30.secs)}</div></div></div>
      <div class="list" style="margin-top:8px">${me.sessions.slice(0, 10).map((s) => `<div class="row between"><div><b>${esc(s.game_type)} ${esc(s.blinds)}</b><div class="small muted">${dateLabel(s.play_date)}</div></div><b>${dur(s.active_seconds)}</b></div>`).join('') || `<div class="muted">${t('noRecords')}</div>`}</div>
      <p class="small muted" style="margin:8px 0 0">${t('restNote')}</p></section>
    <section class="card"><h2 style="margin-bottom:6px">${t('promos')}</h2>
      <div class="list">${room.promotions.map((p) => `<div><b>${esc(p.title)}</b>${p.body ? `<div class="small muted" style="white-space:pre-line">${esc(p.body)}</div>` : ''}</div>`).join('') || `<div class="muted small">${t('noPromos')}</div>`}</div></section>`;
  flashMsg = null;
  if (m.has_photo) (photo ? Promise.resolve({ data: photo }) : api('/member/photo')).then((ph) => { photo = ph.data; const a = main.querySelector('.avatar'); if (a) { const img = new Image(); img.alt = ''; img.src = ph.data; a.textContent = ''; a.appendChild(img); } }).catch(() => {});
  const leave = document.getElementById('leave');
  if (leave) leave.onclick = async () => { try { await api('/member/waitlist/leave', 'POST', {}); renderHome(); } catch (e) { flashMsg = { kind: 'err', text: t('error') }; renderHome(); } };
  const jf = document.getElementById('jf');
  if (jf) jf.onsubmit = async (e) => { e.preventDefault(); try { await api('/member/waitlist', 'POST', { game: document.getElementById('game').value }); flashMsg = { kind: 'ok', text: t('joined') }; } catch (err) { flashMsg = { kind: 'err', text: err.status === 409 ? t('already') : t('error') }; } renderHome(); };
  clearInterval(timer); timer = setInterval(() => { if (document.visibilityState === 'visible' && !document.activeElement.matches('select,input')) renderHome(); }, 20000);
}

langSel.onchange = () => { lang = langSel.value; localStorage.setItem(LANG_KEY, lang); token ? renderHome() : renderLogin(); };
logoutBtn.onclick = async () => { try { await api('/member/logout', 'POST', {}); } catch (e) {} token = ''; photo = null; localStorage.removeItem(KEY); renderLogin(); };
token ? renderHome() : renderLogin();
})();
</script>
</body>
</html>
